<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyCast">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>MyCast</title>
<link rel="apple-touch-icon" id="appleIcon">
<link rel="manifest" id="manifestLink">
<style>
  :root{
    --bg:#0a0a0c; --bg2:#131316; --card:#1c1c1e; --card2:#2c2c2e;
    --text:#fff; --text2:#8e8e93; --text3:#48484a;
    --accent:#0a84ff; --accent2:#5e5ce6; --accent-soft:rgba(10,132,255,.15);
    --grad:linear-gradient(135deg,#5b6cff,#9a6cff);
    --grad-soft:linear-gradient(140deg,rgba(91,108,255,.14),rgba(176,108,255,.06));
    --green:#30d158; --red:#ff453a;
    --border:rgba(255,255,255,.08);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    min-height:100%;overscroll-behavior:none}
  body{
    padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 280px);
    max-width:480px;margin:0 auto;min-height:100dvh;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:manipulation;
  }
  input,textarea{-webkit-user-select:text;user-select:text}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 55% at 50% -12%, rgba(91,108,255,.16), transparent 62%),
      radial-gradient(90% 45% at 105% 108%, rgba(176,108,255,.10), transparent 62%);
  }
  .app-wrap{position:relative;z-index:1}

  /* ── Topbar ── */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px;gap:12px}
  .titleWrap{min-width:0}
  .topbar h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.03em;line-height:1.1}
  .subtitle{margin:4px 0 0;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.02em}
  .topbar-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .icon-btn{width:48px;height:48px;border-radius:50%;background:var(--card);border:none;color:var(--text);
    font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;
    position:relative;z-index:2;transition:transform .12s,background .12s}
  .icon-btn:active{transform:scale(.9);background:var(--card2)}

  /* ── Section ── */
  .section{margin-bottom:20px}
  .step-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2);
    margin-bottom:10px;letter-spacing:.04em;flex-wrap:wrap}
  .step-num{display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    font-size:12px;font-weight:700;flex-shrink:0}
  .step-label.is-active{color:var(--accent)}
  .step-label.is-active .step-num{background:var(--accent);color:#fff}
  .hint{color:var(--text3);font-weight:400;font-size:11px;margin-left:4px}

  /* ── Tags ── */
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);
    color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:background .15s,border-color .15s,transform .1s;
    -webkit-appearance:none;appearance:none;touch-action:manipulation;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .tag:active{transform:scale(.96)}
  .tag[data-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tag[data-selected="true"]::before{content:'✓ ';font-weight:700}

  /* ── Generate button ── */
  .genBtn{
    display:block;width:100%;min-height:100px;padding:18px 20px;
    background:var(--grad);color:#fff;border:none;border-radius:20px;
    text-align:center;box-sizing:border-box;cursor:pointer;
    box-shadow:0 10px 28px rgba(91,108,255,.40);
    transition:transform .12s,opacity .12s;font-family:inherit;
    -webkit-appearance:none;appearance:none;
  }
  .genBtn:active{transform:scale(.98);opacity:.9}
  .genBtn .icon{display:block;font-size:32px;line-height:1;margin-bottom:6px;color:#fff}
  .genBtn .main{display:block;font-size:17px;font-weight:700;line-height:1.4;color:#fff}
  .genBtn .sub{display:block;font-size:11.5px;line-height:1.4;margin-top:4px;color:#fff;opacity:.9}

  /* ── Audio tabs ── */
  .audio-tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:12px}
  .audio-tab{flex:1;padding:9px 4px;border:none;border-radius:9px;background:transparent;color:var(--text2);
    font-size:11.5px;font-weight:650;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none;transition:background .15s,color .15s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .audio-tab.is-active{background:var(--accent);color:#fff}
  .audio-tab .tab-count{font-size:10px;opacity:.8;margin-left:2px}
  .audio-tab.is-active .tab-count{opacity:.95}

  .clear-played-wrap{margin-bottom:10px}
  .clear-played-btn{width:100%;padding:10px;border-radius:10px;border:none;
    background:rgba(255,69,58,.12);color:#ff7070;font-size:13px;font-weight:650;
    font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
  .clear-played-btn:active{background:rgba(255,69,58,.22)}

  /* ── History ── */
  .history{display:flex;flex-direction:column;gap:8px}
  .history-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--card);border-radius:16px;border:1px solid var(--border);
    transition:background .18s,border-color .18s,transform .12s,opacity .2s;
    cursor:pointer;position:relative;overflow:hidden;
  }
  .history-item:active{transform:scale(.985)}
  .history-item.playing{background:rgba(91,108,255,.15);border-color:rgba(91,108,255,.38)}
  .history-item.read:not(.playing){opacity:.55}
  .history-item .thumb{
    flex:0 0 42px;width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);border:1px solid rgba(91,108,255,.20);
    color:#c8cfff;font-size:15px;font-weight:700;cursor:pointer;
    -webkit-appearance:none;appearance:none;padding:0;font-family:inherit;
    transition:transform .12s,background .12s;
  }
  .history-item .thumb:active{transform:scale(.92)}
  .history-item.playing .thumb{background:var(--grad);color:#fff;border-color:transparent}
  .history-item .thumb svg{width:18px;height:18px}
  .history-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .history-title{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px;font-weight:600;line-height:1.35;word-break:break-word;
  }
  .history-num{color:var(--accent);font-weight:800;margin-right:3px;font-variant-numeric:tabular-nums}
  .history-item.playing .history-num{color:#c8cfff}
  .history-sub{font-size:11.5px;color:var(--text2);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
  .history-del{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:transparent;
    border:none;color:var(--text2);font-size:14px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-family:inherit;padding:0;-webkit-appearance:none;appearance:none;
    transition:background .12s,color .12s}
  .history-del:active{background:rgba(255,69,58,.15);color:var(--red)}
  .history-bar{position:absolute;left:0;bottom:0;height:2px;background:var(--grad);
    border-radius:0 1px 1px 0;transition:width .3s linear}
  .empty{color:var(--text3);font-size:13.5px;padding:18px 0;text-align:center}
  .empty small{display:block;font-size:11.5px;margin-top:6px;color:var(--text3)}

  .eq{display:flex;align-items:flex-end;justify-content:center;gap:2.5px;height:14px;color:#fff}
  .eq i{display:block;width:2.5px;border-radius:1.5px;background:currentColor;
    transform-origin:bottom;animation:eqb .85s ease-in-out infinite alternate;
    animation-play-state:paused}
  .eq i:nth-child(1){height:45%;animation-delay:-.20s}
  .eq i:nth-child(2){height:92%;animation-delay:-.52s}
  .eq i:nth-child(3){height:64%;animation-delay:-.08s}
  .eq i:nth-child(4){height:100%;animation-delay:-.70s}
  .history-item.playing .eq i{animation-play-state:running}
  .player.show .pthumb .eq i{animation-play-state:running}
  @keyframes eqb{from{transform:scaleY(.22)}to{transform:scaleY(1)}}

  /* ── Player ── */
  .player{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:10px 14px calc(var(--safe-bottom) + 10px);
    background:rgba(20,20,25,.82);
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    border-top:1px solid rgba(255,255,255,.09);
    box-shadow:0 -12px 40px rgba(0,0,0,.55);
    transform:translateY(115%);
    transition:transform .38s cubic-bezier(.32,.72,0,1);
    will-change:transform;
  }
  .player.show{transform:translateY(0)}

  .phead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .pthumb{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;color:#fff;
    background:var(--grad);box-shadow:0 6px 16px rgba(91,108,255,.30)}
  .pmeta{flex:1;min-width:0}
  .ptitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px;font-weight:650;line-height:1.3;word-break:break-word}
  .psub{font-size:11px;color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums}

  .seekRow{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .seek{-webkit-appearance:none;appearance:none;flex:1;height:20px;margin:0;background:transparent}
  .seek::-webkit-slider-runnable-track{height:5px;border-radius:3px;
    background:linear-gradient(90deg,#5b6cff 0%,#9a6cff var(--p,0%),rgba(255,255,255,.13) var(--p,0%),rgba(255,255,255,.13) 100%)}
  .seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;
    margin-top:-4.5px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
  .seek::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.13)}
  .seek::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:#fff}
  .ptime{font-size:11px;font-weight:600;color:var(--text2);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;flex:0 0 auto;min-width:78px;text-align:right}

  .pctrl{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 4px}
  .btn{width:44px;height:44px;border:none;background:transparent;color:var(--text);
    display:grid;place-items:center;border-radius:50%;padding:0;
    transition:transform .12s,opacity .12s,background .12s}
  .btn:active{transform:scale(.9);opacity:.65}
  .btn svg{width:20px;height:20px}
  .btn.play{width:52px;height:52px;border-radius:50%;color:#fff;background:var(--grad);
    box-shadow:0 8px 22px rgba(91,108,255,.42)}
  .btn.play svg{width:22px;height:22px}
  #playBtn .ico-pause{display:none}
  body.is-playing #playBtn .ico-play{display:none}
  body.is-playing #playBtn .ico-pause{display:block}
  .skipBtn{width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);
    color:var(--text);font-size:13px;font-weight:700;letter-spacing:-.02em;
    display:grid;place-items:center;padding:0;
    transition:transform .12s,background .12s;font-family:inherit}
  .skipBtn:active{transform:scale(.9);background:rgba(91,108,255,.22)}

  .pfoot{display:flex;align-items:center;gap:8px;padding:0 2px}
  .repBtn{position:relative;width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:transparent;border:none;color:var(--text2);
    display:grid;place-items:center;padding:0;transition:color .15s,background .15s}
  .repBtn svg{width:17px;height:17px}
  .repBtn.on{color:#c8cfff;background:rgba(91,108,255,.18)}
  .repNum{position:absolute;bottom:2px;right:2px;font-size:8px;font-weight:800;color:#fff;
    background:var(--accent2);width:11px;height:11px;border-radius:50%;
    display:none;place-items:center;line-height:1}
  .repBtn.one .repNum{display:grid}
  .spdLabel{font-size:11px;font-weight:600;color:var(--text2);flex:0 0 auto}
  .spdRange{flex:1;-webkit-appearance:none;appearance:none;height:18px;margin:0;background:transparent}
  .spdRange::-webkit-slider-runnable-track{height:4px;border-radius:2px;
    background:linear-gradient(90deg,#5b6cff 0%,#9a6cff var(--p,20%),rgba(255,255,255,.13) var(--p,20%),rgba(255,255,255,.13) 100%)}
  .spdRange::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;
    margin-top:-4.5px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
  .spdRange::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
  .spdRange::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff}
  .spdValue{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
    min-width:40px;text-align:right;flex:0 0 auto;letter-spacing:-.01em}
  .miniBtn{height:26px;padding:0 9px;border-radius:8px;border:none;
    background:rgba(255,255,255,.08);color:var(--text);
    font-size:11px;font-weight:650;flex:0 0 auto;font-family:inherit}
  .miniBtn:active{background:rgba(91,108,255,.28)}

  /* ── Modal ── */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:100;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
  .modal.show{opacity:1;visibility:visible;pointer-events:auto}
  .modal-card{width:100%;height:92vh;max-height:92vh;background:var(--bg2);
    border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    padding:20px 16px 14px;flex:0 0 auto}
  .modal-head h2{font-size:20px;font-weight:700;margin:0}

  .tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;
    margin:0 16px 14px;flex:0 0 auto}
  .tab-btn{flex:1;padding:10px;border-radius:9px;border:none;background:transparent;color:var(--text2);
    font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none}
  .tab-btn.is-active{background:var(--accent);color:#fff}
  .tab-panel[hidden]{display:none}
  .tab-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 16px calc(var(--safe-bottom) + 20px);overscroll-behavior:contain}

  .field{margin-bottom:20px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px}
  .hint2{color:var(--text3);font-weight:400;font-size:12px;margin-left:6px}
  textarea,input[type="text"]{width:100%;background:var(--card);border:1px solid var(--border);
    border-radius:12px;color:var(--text);padding:12px;font-size:15px;font-family:inherit;
    resize:vertical;outline:none;box-sizing:border-box;-webkit-appearance:none;line-height:1.5}
  textarea:focus,input[type="text"]:focus{border-color:var(--accent)}

  .folders-list{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
  .folder-card{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--border);
    display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s ease}
  .folder-card.flash{box-shadow:0 0 0 2px var(--accent)}
  .folder-card.theme-drop-over{box-shadow:0 0 0 2px var(--accent);background:rgba(91,108,255,.1)}
  .folder-head{display:flex;gap:6px;align-items:center}
  .folder-name{flex:1;background:transparent;border:none;color:var(--text);
    font-size:15px;font-weight:700;padding:6px 8px;border-radius:8px;outline:none;font-family:inherit;min-width:0}
  .folder-name:focus{background:var(--bg2)}
  .folder-actions{display:flex;gap:4px;flex:0 0 auto}
  .folder-actions button{width:32px;height:32px;border-radius:8px;border:none;
    background:var(--bg2);color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;
    -webkit-appearance:none;appearance:none}
  .folder-actions button:active{background:var(--card2)}
  .folder-actions .del-btn{color:var(--red)}
  .folder-prompt{min-height:70px;font-size:13px}
  .folder-themes{display:flex;flex-direction:column;gap:8px;
    padding-left:10px;border-left:2px solid var(--border)}
  .theme-card{background:var(--bg2);border-radius:10px;padding:8px;border:1px solid var(--border);
    display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s,opacity .15s}
  .theme-card.theme-drop-before{box-shadow:0 -3px 0 0 var(--accent)}
  .theme-card.theme-drop-after{box-shadow:0 3px 0 0 var(--accent)}
  .theme-head{display:flex;gap:6px;align-items:center}
  .theme-grip{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    color:var(--text3);cursor:grab;touch-action:none;border-radius:6px;font-size:15px;flex-shrink:0;
    -webkit-user-select:none;user-select:none}
  .theme-grip:active{background:var(--accent-soft);color:var(--accent);cursor:grabbing}
  .theme-name-input{flex:1;background:transparent;border:none;color:var(--text);
    font-size:13.5px;font-weight:600;padding:6px 8px;border-radius:6px;outline:none;font-family:inherit;min-width:0}
  .theme-name-input:focus{background:var(--card)}
  .theme-source-input{font-size:12.5px;min-height:70px}
  .empty-themes{color:var(--text3);font-size:12px;padding:8px 0;text-align:center}
  .add-theme-btn{width:100%;padding:9px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
    border:1px dashed var(--accent);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none}

  .add-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    border:1px dashed var(--accent);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none}

  .note{color:var(--text3);font-size:12px;line-height:1.6;margin:0 0 12px}
  .data-btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--accent-soft);
    color:var(--accent);border:1px solid var(--border);font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;margin-bottom:10px;-webkit-appearance:none;appearance:none}
  .data-btn:active{background:rgba(10,132,255,.28)}

  /* ── Drag ghost ── */
  .drag-ghost{position:fixed;pointer-events:none;z-index:1000;opacity:.88;
    transform:rotate(1.5deg);box-shadow:0 12px 40px rgba(0,0,0,.65);
    border-radius:10px;background:var(--bg2);border:2px solid var(--accent);
    padding:10px 14px;font-size:13px;font-weight:600;color:var(--text);
    max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── Toast ── */
  .toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 280px);
    transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--text);
    padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;
    transition:opacity .2s,transform .2s;pointer-events:none;z-index:200;white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:90vw;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:10px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toastAction{border:none;background:rgba(91,108,255,.32);color:#c8cfff;
    font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:8px;flex:0 0 auto;white-space:nowrap}
  .toastAction:active{background:rgba(91,108,255,.5)}

  /* ── Drop overlay ── */
  .drop-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;
    background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:opacity .18s}
  .drop-overlay.show{opacity:1}
  .drop-overlay div{padding:44px 56px;border:2px dashed rgba(140,150,255,.75);border-radius:28px;
    font-size:17px;font-weight:700;color:#cfd4ff;background:rgba(91,108,255,.10);
    text-align:center;line-height:1.6}
  .drop-overlay small{display:block;font-size:12px;font-weight:500;color:#a8b0d8;margin-top:8px}
</style>
</head>
<body>

<div class="app-wrap">
  <header class="topbar">
    <div class="titleWrap">
      <h1>MyCast</h1>
      <p class="subtitle" id="subtitle">音声解説 × プレイヤー</p>

  <main>

      <div class="step-label is-active"><span class="step-num">1</span>プロンプトフォルダ<span class="hint">長押しで編集</span></div>

</div>

<!-- プレイヤー -->
<div class="player" id="player">
  <div class="phead">

<audio id="audio" playsinline preload="metadata"></audio>

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════
   MyCast — 統合版
   ═══════════════════════════════════════ */

var STORAGE_KEY = 'mycast.v2';
var LEGACY_KEYS = ['mycast.v1', 'nblink.v9', 'nblink.v8', 'nblink.v7'];
var MAX_HISTORY = 200;
var REUSE_WINDOW_MS = 30000;
var GENERATING_THRESHOLD_MS = 10 * 60 * 1000; // 10分
var NOTEBOOK_URL = 'https://notebooklm.google.com/';
var LONG_PRESS_MS = 550;
var DEFAULT_PROMPT = '以下のソースを参考に、テーマ「{theme}」について音声でわかりやすく解説してください。';
var ICON_FILE = 'icon.png';

function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }

/* ── State ── */
var state = {
  commonPrompt: '',
  prompts: [],           // [{ id, name, text, themes: [{ id, name, source }] }]
  history: [],           // [{ id, number, title, date, time, read, hasAudio, audioDuration, ... }]
  selectedPromptId: null,
  selectedThemeId: null,
  lastGenAt: 0,
  lastGenId: null,
  nextNumber: 1,
  rate: 1,
  repeatMode: 'off',
  audioTab: 'new'
};

var currentId = null;
var audioUrls = {};
var audioPositions = {};
var scrubbing = false;
var toastTimer = null;
var suppressClickUntil = 0;
var db = null;
var ICON_ABS = '';
var themeDrag = null;

/* ── Utils ── */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function formatNum(n){ return String(n).padStart(3, '0'); }
function numTag(n){ return '【' + formatNum(n) + '】'; }
function safeId(v){ return (typeof v === 'string' && /^[A-Za-z0-9_-]+$/.test(v)) ? v : null; }
function fmtTime(s){
  if(!isFinite(s) || s < 0) return '0:00';
  s = Math.floor(s);
  var h = Math.floor(s/3600);
  var m = Math.floor((s%3600)/60);
  var ss = String(s%60).padStart(2,'0');
  return h > 0 ? (h+':'+String(m).padStart(2,'0')+':'+ss) : (m+':'+ss);
}
function formatDateLabel(d){
  var days = ['日','月','火','水','木','金','土'];
  return (d.getMonth()+1)+'月'+d.getDate()+'日('+days[d.getDay()]+') '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtRate(r){ return r.toFixed(1) + '×'; }

function showToast(msg, actionLabel, actionFn, duration){
  var el = $('#toast'); if(!el) return;
  el.innerHTML = '';
  var span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(actionLabel && actionFn){
    var btn = document.createElement('button');
    btn.className = 'toastAction';
    btn.textContent = actionLabel;
    btn.addEventListener('click', function(){ actionFn(); hideToast(); });
    el.appendChild(btn);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, duration || (actionLabel ? 5000 : 2200));
}
function hideToast(){
  var el = $('#toast'); if(el) el.classList.remove('show');
  clearTimeout(toastTimer);
}

/* ── Extract number from filename ── */
function extractNumberFromFilename(name){
  var base = String(name || '').replace(/\.[^.]+$/, '');
  // 【001】 or 【1】
  var m = base.match(/【(\d{1,4})】/);
  if(m) return parseInt(m[1], 10);
  // 001_xxx, 001-xxx, 001.xxx, 001 xxx
  m = base.match(/^(\d{1,4})[\s_\-\.]/);
  if(m) return parseInt(m[1], 10);
  // xxx_001, xxx-001
  m = base.match(/[\s_\-](\d{1,4})$/);
  if(m) return parseInt(m[1], 10);
  return null;
}
function cleanTitleFromFile(name){
  return String(name || '').replace(/\.[^.]+$/, '').trim() || '(無題)';
}

/* ── Icons / Manifest ── */
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  if(typeof g.roundRect === 'function'){ g.roundRect(x, y, w, h, r); return; }
  r = Math.min(r, w/2, h/2);
  g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r);
  g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r);
  g.arcTo(x, y, x+w, y, r);
  g.closePath();
}
function buildAssets(){
  var iconAbs;
  try{ iconAbs = new URL(ICON_FILE, location.href).href; }catch(e){ iconAbs = ICON_FILE; }
  var appleIcon = document.getElementById('appleIcon');
  if(appleIcon) appleIcon.href = ICON_FILE;
  var manifest = {
    name: 'MyCast',
    short_name: 'MyCast',
    description: '音声解説の生成と再生をひとつに。',
    start_url: location.href,
    scope: './',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#0a0a0c',
    theme_color: '#0a0a0c',
    icons: [
      { src: iconAbs, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: iconAbs, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: iconAbs, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
  try{
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifestLink').href = URL.createObjectURL(blob);
  }catch(e){}
  return iconAbs;
}

/* ── IndexedDB ── */
function openDB(){
  return new Promise(function(res, rej){
    var req = indexedDB.open('mycast-db', 1);
    req.onupgradeneeded = function(e){
      var d = e.target.result;
      if(!d.objectStoreNames.contains('audio')) d.createObjectStore('audio', { keyPath: 'id' });
      if(!d.objectStoreNames.contains('positions')) d.createObjectStore('positions', { keyPath: 'id' });
    };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}
function dbPutAudio(id, blob, name){
  return new Promise(function(res, rej){
    var r = db.transaction('audio','readwrite').objectStore('audio').put({ id: id, blob: blob, name: name, addedAt: Date.now() });
    r.onsuccess = function(){ res(); };
    r.onerror = function(){ rej(r.error); };
  });
}
function dbGetAudio(id){
  return new Promise(function(res, rej){
    var r = db.transaction('audio','readonly').objectStore('audio').get(id);
    r.onsuccess = function(){ res(r.result || null); };
    r.onerror = function(){ rej(r.error); };
  });
}
function dbDelAudio(id){
  return new Promise(function(res, rej){
    var r = db.transaction('audio','readwrite').objectStore('audio').delete(id);
    r.onsuccess = function(){ res(); };
    r.onerror = function(){ rej(r.error); };
  });
}
function dbAllPositions(){
  return new Promise(function(res, rej){
    var r = db.transaction('positions','readonly').objectStore('positions').getAll();
    r.onsuccess = function(){ res(r.result || []); };
    r.onerror = function(){ rej(r.error); };
  });
}
function dbSavePos(id, pos){
  if(!db) return Promise.resolve();
  return new Promise(function(res, rej){
    var r = db.transaction('positions','readwrite').objectStore('positions').put({ id: id, position: pos });
    r.onsuccess = function(){ res(); };
    r.onerror = function(){ rej(r.error); };
  });
}
function dbDelPos(id){
  if(!db) return Promise.resolve();
  return new Promise(function(res, rej){
    var r = db.transaction('positions','readwrite').objectStore('positions').delete(id);
    r.onsuccess = function(){ res(); };
    r.onerror = function(){ rej(r.error); };
  });
}

/* ── Save / Load ── */
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('save failed', e); }
}

function migrateSchema(){
  // prompts が旧形式（themes を持たない）の場合、themes を prompts[0].themes に統合
  if(!Array.isArray(state.prompts)) state.prompts = [];

  var needsMigration = false;
  if(state.prompts.length > 0){
    var hasThemesField = state.prompts.some(function(p){ return Array.isArray(p.themes); });
    if(!hasThemesField) needsMigration = true;
  }

  if(needsMigration){
    var oldThemes = Array.isArray(state.themes) ? state.themes : [];
    state.prompts.forEach(function(p, i){
      p.themes = (i === 0) ? oldThemes.slice() : [];
    });
    if(state.prompts.length === 0){
      state.prompts = [{
        id: uid(), name: '標準',
        text: state.commonPrompt || '',
        themes: oldThemes
      }];
      state.commonPrompt = '';
    }
  }
  delete state.themes;

  // 全フォルダに themes 配列を保証
  state.prompts.forEach(function(p){
    if(!Array.isArray(p.themes)) p.themes = [];
  });
}

function normalize(){
  if(typeof state.commonPrompt !== 'string') state.commonPrompt = '';
  if(!Array.isArray(state.prompts)) state.prompts = [];
  if(!Array.isArray(state.history)) state.history = [];

  // フォルダ検証
  state.prompts.forEach(function(p){
    if(!safeId(p.id)) p.id = uid();
    if(typeof p.name !== 'string') p.name = '';
    if(typeof p.text !== 'string') p.text = '';
    if(!Array.isArray(p.themes)) p.themes = [];
    p.themes.forEach(function(t){
      if(!safeId(t.id)) t.id = uid();
      if(typeof t.name !== 'string') t.name = '';
      if(typeof t.source !== 'string') t.source = '';
    });
  });

  if(state.prompts.length === 0){
    state.prompts = [{
      id: uid(), name: '標準', text: state.commonPrompt || '',
      themes: [{ id: uid(), name: 'サンプルテーマ',
        source: 'ここにソーステキストを入力してください。Notebook に渡したい本文を貼り付けます。' }]
    }];
    if(!state.commonPrompt.trim()) state.commonPrompt = DEFAULT_PROMPT;
  }

  // 履歴検証
  state.history.forEach(function(h){
    if(!safeId(h.id)) h.id = uid();
    if(typeof h.number !== 'number' || !isFinite(h.number)) h.number = 0;
    if(typeof h.title !== 'string') h.title = '';
    if(typeof h.date !== 'string') h.date = '';
    if(typeof h.time !== 'number') h.time = 0;
    if(typeof h.read !== 'boolean') h.read = false;
    if(typeof h.hasAudio !== 'boolean') h.hasAudio = false;
    if(typeof h.audioDuration !== 'number') h.audioDuration = 0;
  });

  if(typeof state.nextNumber !== 'number' || !isFinite(state.nextNumber) || state.nextNumber < 1){
    var maxNum = 0;
    state.history.forEach(function(h){ if(h.number > maxNum) maxNum = h.number; });
    state.nextNumber = maxNum + 1;
  }
  if(typeof state.rate !== 'number' || state.rate < 0.5 || state.rate > 3) state.rate = 1;
  if(['off','all','one'].indexOf(state.repeatMode) === -1) state.repeatMode = 'off';
  if(['new','generating','unplayed','played'].indexOf(state.audioTab) === -1) state.audioTab = 'new';

  // 選択の整合性
  var selectedFolder = state.prompts.find(function(p){ return p.id === state.selectedPromptId; });
  if(!selectedFolder){
    state.selectedPromptId = state.prompts[0].id;
    selectedFolder = state.prompts[0];
  }
  var themeExists = selectedFolder.themes.some(function(t){ return t.id === state.selectedThemeId; });
  if(!themeExists){
    state.selectedThemeId = selectedFolder.themes[0] ? selectedFolder.themes[0].id : null;
  }

  if(state.history.length > MAX_HISTORY) trimHistory();
}

function trimHistory(){
  if(state.history.length <= MAX_HISTORY) return;
  var removed = state.history.slice(MAX_HISTORY);
  removed.forEach(function(r){
    if(audioUrls[r.id]){ try{ URL.revokeObjectURL(audioUrls[r.id]); }catch(e){} delete audioUrls[r.id]; }
    delete audioPositions[r.id];
    if(db){ dbDelAudio(r.id).catch(function(){}); dbDelPos(r.id).catch(function(){}); }
  });
  state.history = state.history.slice(0, MAX_HISTORY);
}

function load(){
  var parsed = null;
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) parsed = JSON.parse(raw);
    if(!parsed){
      for(var i=0;i<LEGACY_KEYS.length;i++){
        var lk = LEGACY_KEYS[i];
        var lv = localStorage.getItem(lk);
        if(lv){ try{ parsed = JSON.parse(lv); break; }catch(e){} }
      }
    }
  }catch(e){ parsed = null; }

  if(parsed && typeof parsed === 'object'){
    if(typeof parsed.commonPrompt === 'string') state.commonPrompt = parsed.commonPrompt;
    if(Array.isArray(parsed.prompts)) state.prompts = parsed.prompts;
    if(Array.isArray(parsed.themes)) state.themes = parsed.themes;  // 旧形式
    if(Array.isArray(parsed.history)) state.history = parsed.history;
    if(parsed.selectedPromptId) state.selectedPromptId = parsed.selectedPromptId;
    if(parsed.selectedThemeId) state.selectedThemeId = parsed.selectedThemeId;
    if(typeof parsed.lastGenAt === 'number') state.lastGenAt = parsed.lastGenAt;
    if(typeof parsed.lastGenId === 'string') state.lastGenId = parsed.lastGenId;
    if(typeof parsed.nextNumber === 'number') state.nextNumber = parsed.nextNumber;
    if(typeof parsed.rate === 'number') state.rate = parsed.rate;
    if(typeof parsed.repeatMode === 'string') state.repeatMode = parsed.repeatMode;
    if(typeof parsed.audioTab === 'string') state.audioTab = parsed.audioTab;
  }
  migrateSchema();
  normalize();
  save();
}

/* ── Getters ── */
function getSelectedFolder(){
  return state.prompts.find(function(p){ return p.id === state.selectedPromptId; }) || null;
}
function getSelectedTheme(){
  var folder = getSelectedFolder();
  if(!folder) return null;
  return folder.themes.find(function(t){ return t.id === state.selectedThemeId; }) || null;
}
function getEntry(id){
  return state.history.find(function(h){ return h.id === id; }) || null;
}
function findFolderByThemeId(themeId){
  return state.prompts.find(function(p){
    return p.themes.some(function(t){ return t.id === themeId; });
  }) || null;
}

/* ── Tab logic ── */
function getEntryTab(entry){
  if(entry.hasAudio) return entry.read ? 'played' : 'unplayed';
  var age = Date.now() - entry.time;
  return age < GENERATING_THRESHOLD_MS ? 'new' : 'generating';
}

/* ── Render main ── */
function renderPromptTags(){
  var el = $('#promptTags'); if(!el) return;
  el.innerHTML = '';
  state.prompts.forEach(function(p){

      (isPlaying ? ' playing' : '') +
      (h.read && !isPlaying ? ' read' : '');

    if(h.hasAudio){
      thumb = isPlaying
        ? '<div class="eq"><i></i><i></i><i></i><i></i></div>'
        : SVG_PLAY;
    }else{
      thumb = SVG_IMPORT;
    }

    var durTxt = '';
    if(h.hasAudio && h.audioDuration > 0) durTxt = ' · ' + fmtTime(h.audioDuration);
    else if(h.hasAudio) durTxt = ' · 音声あり';
    else durTxt = ' · 音声未登録';
    var sub = (h.date || '') + durTxt;

    var pct = 0;
    if(h.id === currentId && h.audioDuration > 0){
      pct = Math.min(100, ((audio.currentTime || 0) / h.audioDuration) * 100);
    } else if(h.hasAudio && audioPositions[h.id] > 0 && h.audioDuration > 0){
      pct = Math.min(100, (audioPositions[h.id] / h.audioDuration) * 100);

      '<div class="history-text">' +
        '<div class="history-title"><span class="history-num">' + esc(numTag(h.number)) + '</span>' + esc(h.title) + '</div>' +

      (pct > 0.5 ? '<div class="history-bar" style="width:' + pct.toFixed(1) + '%"></div>' : '');

    el.appendChild(row);
  });

function initTagInteractions(){
  var pressTimer = null;
  var pendingBtn = null;
  var pendingKind = null;
  var startX = 0, startY = 0;

  function reset(){
    clearTimeout(pressTimer); pressTimer = null; pendingBtn = null; pendingKind = null;
  }

  document.addEventListener('pointerdown', function(e){
    var btn = e.target.closest ? e.target.closest('button.tag') : null;
    if(!btn) return;
    // どのコンテナ内か判定
    var kind = null;
    if(btn.closest('#promptTags')) kind = 'folder';
    else if(btn.closest('#tags')) kind = 'theme';
    if(!kind) return;

    startX = e.clientX; startY = e.clientY;
    pendingBtn = btn;
    pendingKind = kind;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function(){
      pressTimer = null;
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(err){} }
    }, LONG_PRESS_MS);
  }, { passive:true });

  document.addEventListener('pointermove', function(e){
    if(!pressTimer && !pendingBtn) return;
    if(Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) reset();
  }, { passive:true });

  document.addEventListener('pointerup', function(){
    var wasPressed = pressTimer === null && pendingBtn && pendingKind;
    clearTimeout(pressTimer); pressTimer = null;
    if(wasPressed){
      var id = pendingBtn.dataset.id;
      var kind = pendingKind;
      pendingBtn = null; pendingKind = null;
      suppressClickUntil = Date.now() + 800;
      openEditorForTag(kind, id);
    } else {
      pendingBtn = null; pendingKind = null;
    }
  });

  document.addEventListener('pointercancel', reset);

  document.addEventListener('click', function(e){
    if(Date.now() < suppressClickUntil){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    }
  }, true);

  document.addEventListener('contextmenu', function(e){
    if(e.target && e.target.closest && e.target.closest('button.tag')) e.preventDefault();
  });
}

/* ── Copy / External ── */
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  return ok;
}
function copyQuiet(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  }
  fallbackCopy(text);
  return Promise.resolve();
}
function openExternal(url){
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if(isIOS && standalone){
    var navigated = false;
    var onVis = function(){ if(document.visibilityState === 'hidden') navigated = true; };
    document.addEventListener('visibilitychange', onVis);
    try{ window.location.href = 'x-safari-' + url; }catch(e){}
    setTimeout(function(){
      document.removeEventListener('visibilitychange', onVis);
      if(navigated || document.visibilityState === 'hidden') return;
      window.open(url, '_blank');
    }, 1000);
    return;
  }

  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    if(a.parentNode) a.parentNode.removeChild(a);
  }, 2000);
}

/* ── Generate ── */
function buildPromptText(folder, theme){
  var parts = [];
  var common = (state.commonPrompt || '').trim();
  if(common) parts.push(common);
  var indiv = (folder.text || '').trim();
  if(indiv) parts.push(indiv);
  var combined = parts.join('\n\n');
  return combined.replace(/\{theme\}/g, theme.name || '');
}

function handleGenerate(){
  var folder = getSelectedFolder();
  var theme = getSelectedTheme();
  if(!folder){ showToast('先にプロンプトフォルダを選択してください'); return; }
  if(!theme){ showToast('先にテーマを選択してください'); return; }

  var num = state.nextNumber;
  var numLabel = formatNum(num);
  var instruction = 'タイトルの頭に【' + numLabel + '】を付けてください。';

  var promptText = buildPromptText(folder, theme);
  promptText = (promptText.trim() ? promptText + '\n\n' : '') + instruction;

  var sourceText = ((theme.source || '').trim() || (theme.name || '').trim());
  sourceText = sourceText ? (sourceText + '\n\n' + instruction) : instruction;

  var now = new Date();
  var nowMs = now.getTime();
  var title = (theme.name || '(無題)') + ' / ' + (folder.name || 'フォルダ');
  var dateLabel = formatDateLabel(now);

  var overwrote = false;
  if(state.lastGenId && state.lastGenAt && (nowMs - state.lastGenAt) < REUSE_WINDOW_MS){
    var existing = getEntry(state.lastGenId);
    if(existing && !existing.hasAudio){
      existing.number = num;
      existing.title = title;
      existing.date = dateLabel;
      existing.time = nowMs;
      existing.read = false;
      overwrote = true;
    }
  }
  if(!overwrote){
    var entry = {
      id: uid(),
      number: num,
      title: title,
      date: dateLabel,
      time: nowMs,
      read: false,
      hasAudio: false,
      audioDuration: 0,
      folderName: folder.name,
      themeName: theme.name
    };
    state.history.unshift(entry);
    state.lastGenId = entry.id;
    state.nextNumber = num + 1;
    if(state.history.length > MAX_HISTORY) trimHistory();
  }
  state.lastGenAt = nowMs;
  save();
  state.audioTab = 'new';
  renderAll();

  copyQuiet(promptText);

  var showInstruction = function(){
    showToast('音声生成後、ファイルをドロップまたは📥で取り込み', 'NotebookLM', function(){
      openExternal(NOTEBOOK_URL);
    }, 8000);
  };

  if(navigator.share){
    navigator.share({ text: sourceText }).then(showInstruction).catch(function(err){
      if(err && err.name !== 'AbortError'){
        copyQuiet(sourceText);
        showInstruction();
      }
    });
  }else{
    copyQuiet(sourceText);
    showInstruction();
  }
}

/* ── Audio import ── */
function isAudioFile(file){
  if(!file) return false;
  if(/^audio\//.test(file.type)) return true;
  return /\.(m4a|m4b|mp3|aac|wav|ogg|oga|flac|opus|mp4|aiff?)$/i.test(file.name);
}
function probeAudio(file){
  return new Promise(function(resolve){
    var a = document.createElement('audio');
    a.preload = 'metadata';
    var done = false;
    var finish = function(d){
      if(done) return;
      done = true;
      try{ a.removeAttribute('src'); }catch(e){}
      resolve(d);
    };
    a.onloadedmetadata = function(){
      finish(isFinite(a.duration) && a.duration > 0 ? a.duration : 0);
    };
    a.onerror = function(){ finish(0); };
    a.src = URL.createObjectURL(file);
  });
}

async function importAudioTo(entry, file){
  if(!entry || !file) return;
  if(!isAudioFile(file)){ showToast('音声ファイルではありません'); return; }

  var dur = await probeAudio(file);

  try{
    if(db) await dbPutAudio(entry.id, file, file.name);
  }catch(e){
    console.warn(e);
    showToast('音声の保存に失敗しました');
    return;
  }

  if(audioUrls[entry.id]){
    try{ URL.revokeObjectURL(audioUrls[entry.id]); }catch(e){}
  }
  audioUrls[entry.id] = URL.createObjectURL(file);

  entry.hasAudio = true;
  entry.audioDuration = dur;
  entry.audioName = file.name;
  entry.title = cleanTitleFromFile(file.name);

  var num = extractNumberFromFilename(file.name);
  if(num !== null){
    entry.number = num;
    if(state.nextNumber <= num) state.nextNumber = num + 1;
  }

  audioPositions[entry.id] = 0;
  if(db) dbSavePos(entry.id, 0).catch(function(){});

  save();
  state.audioTab = 'unplayed';
  renderAll();
  showToast(numTag(entry.number) + ' に音声を取り込みました');

  setTimeout(function(){ playEntry(entry.id); }, 300);
}

function pickFileFor(entryId){
  var entry = getEntry(entryId);
  if(!entry) return;
  var input = document.getElementById('fileInput');
  input.value = '';
  input.onchange = function(){
    var f = input.files && input.files[0];
    input.value = '';
    if(!f) return;
    importAudioTo(entry, f);
  };
  input.click();
}

/* ── Global audio drop (main UX) ── */
async function handleAudioDrop(file){
  if(!file || !isAudioFile(file)){ showToast('音声ファイルではありません'); return; }

  var num = extractNumberFromFilename(file.name);
  var target = null;

  if(num !== null){
    target = state.history.find(function(h){
      return h.number === num && !h.hasAudio;
    });
  }

  if(!target){
    // 新規エントリー作成
    var assignNum = (num !== null) ? num : state.nextNumber;
    target = {
      id: uid(),
      number: assignNum,
      title: cleanTitleFromFile(file.name),
      date: formatDateLabel(new Date()),
      time: Date.now(),
      read: false,
      hasAudio: false,
      audioDuration: 0,
      fromAudio: true
    };
    state.history.unshift(target);
    if(assignNum >= state.nextNumber) state.nextNumber = assignNum + 1;
    save();
    showToast('新規Castとして追加');
  } else {
    showToast(numTag(num) + ' にマッチしました');
  }

  await importAudioTo(target, file);
}

async function ensureAudioUrl(id){
  if(audioUrls[id]) return audioUrls[id];
  if(!db) return null;
  var rec = await dbGetAudio(id);
  if(!rec || !rec.blob) return null;
  audioUrls[id] = URL.createObjectURL(rec.blob);

async function playEntry(id){
  var entry = getEntry(id);
  if(!entry) return;
  if(!entry.hasAudio){ pickFileFor(id); return; }

  if(currentId === id && audio.src){
    if(audio.paused || audio.ended) audio.play().catch(function(){});
    else audio.pause();
    return;
  }

  var url = await ensureAudioUrl(id);
  if(!url){ showToast('音声が見つかりません'); return; }

  currentId = id;
  audio.src = url;
  audio.playbackRate = state.rate;
  if('preservesPitch' in audio) audio.preservesPitch = true;

  updateMediaSession(entry);
  if(playerEl) playerEl.classList.add('show');
  renderHistory();
  updatePlayer();

  var pos = audioPositions[id] || 0;
  var applyPos = function(){
    if(pos > 0.5 && audio.duration && pos < audio.duration - 1){
      audio.currentTime = pos;
    }
    setSeekUI();
    updatePositionState();
  };
  if(audio.readyState >= 1) applyPos();
  else audio.addEventListener('loadedmetadata', applyPos, { once: true });

  audio.play().catch(function(){});
}

function togglePlay(){
  if(!currentId){
    for(var i=0;i<state.history.length;i++){
      if(state.history[i].hasAudio){ playEntry(state.history[i].id); return; }
    }
    showToast('音声が取り込まれたCastがありません');
    return;
  }
  if(audio.paused || audio.ended) audio.play().catch(function(){});
  else audio.pause();
}

function skip(sec){
  if(!audio.src) return;
  var dur = isFinite(audio.duration) ? audio.duration : 0;
  var target = audio.currentTime + sec;
  audio.currentTime = Math.max(0, dur ? Math.min(dur, target) : target);
  setSeekUI();
  updatePositionState();
}

function onEnded(){
  var entry = getEntry(currentId);
  if(!entry){ renderHistory(); return; }

  if(state.repeatMode === 'one'){
    audio.currentTime = 0;
    audio.play().catch(function(){});
    return;
  }

  if(!entry.read){
    entry.read = true;
    save();
  }

  var withAudio = state.history.filter(function(h){ return h.hasAudio; });
  var idx = withAudio.findIndex(function(h){ return h.id === currentId; });
  var next = null;
  if(state.repeatMode === 'all' && withAudio.length > 1){
    next = withAudio[(idx + 1) % withAudio.length];
  }

  if(next && next.id !== currentId){
    playEntry(next.id);
  }else{
    document.body.classList.remove('is-playing');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    renderHistory();
  }
}

function setSeekUI(){
  if(!seekEl) return;
  var entry = getEntry(currentId);
  var dur = (isFinite(audio.duration) && audio.duration > 0)
    ? audio.duration
    : (entry && entry.audioDuration ? entry.audioDuration : 0);
  var pos = Math.min(audio.currentTime || 0, dur || 0);
  var p = dur > 0 ? (pos / dur) * 100 : 0;
  seekEl.value = Math.round(p * 10);
  seekEl.style.setProperty('--p', p.toFixed(2) + '%');
  if(pTime) pTime.textContent = fmtTime(pos) + ' / ' + fmtTime(dur);
}

function updatePlayer(){
  if(!playerEl) return;
  var entry = getEntry(currentId);
  if(!entry){ playerEl.classList.remove('show'); return; }
  playerEl.classList.add('show');
  if(pTitle) pTitle.textContent = numTag(entry.number) + entry.title;
  if(pSub) pSub.textContent = (entry.date || '') + (entry.audioDuration ? ' · ' + fmtTime(entry.audioDuration) : '');
  if(!scrubbing) setSeekUI();
}

function setRate(r, syncSlider){
  state.rate = Math.round(r * 10) / 10;
  audio.playbackRate = state.rate;
  if('preservesPitch' in audio) audio.preservesPitch = true;
  if(syncSlider !== false && speedSlider) speedSlider.value = state.rate;
  if(speedSlider){
    var p = ((state.rate - 0.5) / 2.5) * 100;
    speedSlider.style.setProperty('--p', p + '%');
  }
  if(speedValue) speedValue.textContent = fmtRate(state.rate);
  save();
  updatePositionState();
}

function setRepeat(mode){
  state.repeatMode = mode;
  if(repBtn){
    repBtn.classList.toggle('on', mode !== 'off');
    repBtn.classList.toggle('one', mode === 'one');
    repBtn.setAttribute('aria-label',
      mode === 'off' ? 'リピート切替（オフ）' :
      mode === 'all' ? 'リピート切替（全曲）' : 'リピート切替（1曲）');
  }
  save();
}

/* ── Media Session ── */
function updateMediaSession(entry){
  if(!('mediaSession' in navigator)) return;
  if(!entry){
    try{ navigator.mediaSession.metadata = null; }catch(e){}
    return;
  }
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: numTag(entry.number) + entry.title,
      artist: 'MyCast',
      album: '音声解説',
      artwork: [{ src: ICON_ABS, sizes: '512x512', type: 'image/png' }]
    });
  }catch(e){}
}
function updatePositionState(){
  if(!('mediaSession' in navigator)) return;
  var ms = navigator.mediaSession;
  if(typeof ms.setPositionState !== 'function') return;
  var d = audio.duration;
  if(!isFinite(d) || d <= 0) return;
  try{
    ms.setPositionState({
      duration: d,
      playbackRate: audio.playbackRate || 1,
      position: Math.min(Math.max(audio.currentTime, 0), d)
    });
  }catch(e){}
}
function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  var ms = navigator.mediaSession;
  var safe = function(a, fn){ try{ ms.setActionHandler(a, fn); }catch(e){} };
  safe('play', function(){ audio.play().catch(function(){}); });
  safe('pause', function(){ audio.pause(); });
  safe('stop', function(){ audio.pause(); audio.currentTime = 0; });
  safe('seekbackward', function(){ skip(-5); });
  safe('seekforward', function(){ skip(5); });
  safe('seekto', function(d){
    if(d && typeof d.seekTime === 'number'){
      audio.currentTime = d.seekTime;
      updatePositionState();
    }
  });
}

/* ── Delete ── */
function deleteHistory(id){
  var entry = getEntry(id);
  if(!entry) return;
  if(!confirm('このCastを削除しますか？（音声も削除されます）')) return;

  if(currentId === id){
    audio.pause();
    audio.removeAttribute('src');
    try{ audio.load(); }catch(e){}
    currentId = null;
    if(playerEl) playerEl.classList.remove('show');
    updateMediaSession(null);
  }
  if(audioUrls[id]){
    try{ URL.revokeObjectURL(audioUrls[id]); }catch(e){}
    delete audioUrls[id];
  }
  delete audioPositions[id];
  if(db){ dbDelAudio(id).catch(function(){}); dbDelPos(id).catch(function(){}); }

  state.history = state.history.filter(function(h){ return h.id !== id; });
  if(state.lastGenId === id) state.lastGenId = null;
  save();
  renderHistory();
  showToast('削除しました');
}

function clearPlayed(){
  var played = state.history.filter(function(h){ return h.hasAudio && h.read; });
  if(!played.length){ showToast('再生済みの項目がありません'); return; }
  if(!confirm('再生済みの ' + played.length + ' 件をすべて削除しますか？\nこの操作は取り消せません。')) return;

  played.forEach(function(h){
    if(currentId === h.id){
      audio.pause();
      audio.removeAttribute('src');
      try{ audio.load(); }catch(e){}
      currentId = null;
      if(playerEl) playerEl.classList.remove('show');
      updateMediaSession(null);
    }
    if(audioUrls[h.id]){
      try{ URL.revokeObjectURL(audioUrls[h.id]); }catch(e){}
      delete audioUrls[h.id];
    }
    delete audioPositions[h.id];
    if(db){ dbDelAudio(h.id).catch(function(){}); dbDelPos(h.id).catch(function(){}); }
  });
  state.history = state.history.filter(function(h){ return !(h.hasAudio && h.read); });
  save();
  renderHistory();
  showToast(played.length + ' 件を削除しました');
}

/* ── Tabs ── */
function switchTab(name){

/* ── Export / Import ── */
function exportData(){
  var data = {
    app: 'MyCast',
    version: 2,
    exportedAt: new Date().toISOString(),
    commonPrompt: state.commonPrompt,
    prompts: state.prompts,
    history: state.history.map(function(h){
      return {
        id: h.id, number: h.number, title: h.title, date: h.date, time: h.time,
        read: h.read, hasAudio: false, audioDuration: h.audioDuration,
        folderName: h.folderName, themeName: h.themeName
      };
    }),
    selectedPromptId: state.selectedPromptId,
    selectedThemeId: state.selectedThemeId,
    lastGenAt: state.lastGenAt,
    lastGenId: state.lastGenId,
    nextNumber: state.nextNumber,
    rate: state.rate,
    repeatMode: state.repeatMode,
    audioTab: state.audioTab
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var d = new Date();
  var name = 'mycast-' +
    d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') +
    '.json';

  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    if(a.parentNode) a.parentNode.removeChild(a);
    URL.revokeObjectURL(url);
  }, 5000);
  showToast('エクスポートしました');
}

function importData(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(String(reader.result)); }
    catch(e){ showToast('読み込めないファイルです'); return; }
    if(!data || typeof data !== 'object' || !Array.isArray(data.prompts)){
      showToast('読み込めないファイルです'); return;
    }
    if(!confirm('現在のデータを置き換えます。よろしいですか？')) return;

    Object.keys(audioUrls).forEach(function(k){
      try{ URL.revokeObjectURL(audioUrls[k]); }catch(e){}
    });
    audioUrls = {};
    audioPositions = {};

    state.commonPrompt = (typeof data.commonPrompt === 'string') ? data.commonPrompt : '';
    state.prompts = data.prompts;
    state.history = Array.isArray(data.history) ? data.history.map(function(h){
      return {
        id: safeId(h.id) ? h.id : uid(),
        number: (typeof h.number === 'number') ? h.number : 0,
        title: typeof h.title === 'string' ? h.title : '',
        date: typeof h.date === 'string' ? h.date : '',
        time: typeof h.time === 'number' ? h.time : 0,
        read: !!h.read,
        hasAudio: false,
        audioDuration: (typeof h.audioDuration === 'number') ? h.audioDuration : 0,
        folderName: typeof h.folderName === 'string' ? h.folderName : '',
        themeName: typeof h.themeName === 'string' ? h.themeName : ''
      };
    }) : [];
    state.selectedPromptId = data.selectedPromptId || null;
    state.selectedThemeId = data.selectedThemeId || null;
    state.lastGenAt = (typeof data.lastGenAt === 'number') ? data.lastGenAt : 0;
    state.lastGenId = (typeof data.lastGenId === 'string') ? data.lastGenId : null;
    state.nextNumber = (typeof data.nextNumber === 'number') ? data.nextNumber : 1;
    state.rate = (typeof data.rate === 'number') ? data.rate : 1;
    state.repeatMode = (typeof data.repeatMode === 'string') ? data.repeatMode : 'off';
    state.audioTab = (typeof data.audioTab === 'string') ? data.audioTab : 'new';

    migrateSchema();
    normalize();
    save();
    renderAll();
    renderFoldersEditor();
    renderCommonPrompt();
    setRate(state.rate);
    setRepeat(state.repeatMode);
    showToast('インポートしました');
  };
  reader.onerror = function(){ showToast('読み込めませんでした'); };
  reader.readAsText(file);
}

/* ── Theme drag & drop (pointer events based) ── */
function initThemeDrag(){
  var settings = $('#settingsModal');
  if(!settings) return;

  document.addEventListener('pointerdown', function(e){
    var grip = e.target.closest ? e.target.closest('[data-theme-grip]') : null;
    if(!grip) return;
    var themeCard = grip.closest('[data-theme-card]');
    if(!themeCard) return;
    var folderCard = themeCard.closest('[data-prompt-card]');
    if(!folderCard) return;

    e.preventDefault();
    themeDrag = {
      themeId: themeCard.dataset.themeCard,
      promptId: folderCard.dataset.promptCard,
      startX: e.clientX,
      startY: e.clientY,
      active: false,
      ghost: null,
      themeCard: themeCard,
      dropTarget: null
    };
  });

  document.addEventListener('pointermove', function(e){
    if(!themeDrag) return;
    if(!themeDrag.active){
      var dist = Math.hypot(e.clientX - themeDrag.startX, e.clientY - themeDrag.startY);
      if(dist < 6) return;
      themeDrag.active = true;

      var ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      var nameInput = themeDrag.themeCard.querySelector('.theme-name-input');
      ghost.textContent = '⠿ ' + (nameInput ? (nameInput.value || '(無題)') : '(無題)');
      ghost.style.left = '0px';
      ghost.style.top = '0px';
      document.body.appendChild(ghost);
      themeDrag.ghost = ghost;
      themeDrag.themeCard.style.opacity = '0.3';
      if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(e){} }
    }

    themeDrag.ghost.style.left = (e.clientX + 12) + 'px';
    themeDrag.ghost.style.top = (e.clientY + 12) + 'px';

    updateThemeDropTarget(e.clientX, e.clientY);
  });

  document.addEventListener('pointerup', function(e){
    if(!themeDrag) return;
    if(themeDrag.active){
      handleThemeDrop(e.clientX, e.clientY);
    }
    cleanupThemeDrag();
  });

  document.addEventListener('pointercancel', cleanupThemeDrag);
}

function updateThemeDropTarget(x, y){
  $$('.theme-drop-over, .theme-drop-before, .theme-drop-after').forEach(function(el){
    el.classList.remove('theme-drop-over', 'theme-drop-before', 'theme-drop-after');
  });
  themeDrag.dropTarget = null;

  var el = document.elementFromPoint(x, y);
  if(!el) return;
  if(themeDrag.ghost && themeDrag.ghost.contains(el)) return;

  var themeEl = el.closest('[data-theme-card]');
  if(themeEl && themeEl !== themeDrag.themeCard){
    var rect = themeEl.getBoundingClientRect();
    if(y < rect.top + rect.height / 2){
      themeEl.classList.add('theme-drop-before');
    } else {
      themeEl.classList.add('theme-drop-after');
    }
    themeDrag.dropTarget = { type: 'theme', el: themeEl };
    return;
  }

  var folderEl = el.closest('[data-prompt-card]');
  if(folderEl){
    folderEl.classList.add('theme-drop-over');
    themeDrag.dropTarget = { type: 'folder', el: folderEl };
  }
}

function handleThemeDrop(x, y){
  var dt = themeDrag && themeDrag.dropTarget;
  if(!dt) return;

  var srcFolder = state.prompts.find(function(p){ return p.id === themeDrag.promptId; });
  if(!srcFolder) return;
  var srcIdx = srcFolder.themes.findIndex(function(t){ return t.id === themeDrag.themeId; });
  if(srcIdx === -1) return;
  var theme = srcFolder.themes[srcIdx];

  if(dt.type === 'theme'){
    var targetThemeId = dt.el.dataset.themeCard;
    var targetFolderId = dt.el.closest('[data-prompt-card]').dataset.promptCard;
    var targetFolder = state.prompts.find(function(p){ return p.id === targetFolderId; });
    if(!targetFolder) return;
    var targetIdx = targetFolder.themes.findIndex(function(t){ return t.id === targetThemeId; });
    if(targetIdx === -1) return;

    var insertBefore = dt.el.classList.contains('theme-drop-before');

    srcFolder.themes.splice(srcIdx, 1);

    var finalIdx;
    if(srcFolder === targetFolder){
      if(insertBefore){
        finalIdx = (srcIdx < targetIdx) ? targetIdx - 1 : targetIdx;
      } else {
        finalIdx = (srcIdx < targetIdx) ? targetIdx : targetIdx + 1;
      }
      finalIdx = Math.max(0, Math.min(targetFolder.themes.length, finalIdx));
      targetFolder.themes.splice(finalIdx, 0, theme);
    } else {
      finalIdx = insertBefore ? targetIdx : targetIdx + 1;
      finalIdx = Math.max(0, Math.min(targetFolder.themes.length, finalIdx));
      targetFolder.themes.splice(finalIdx, 0, theme);
    }
  } else if(dt.type === 'folder'){
    var targetFolderId2 = dt.el.dataset.promptCard;
    var targetFolder2 = state.prompts.find(function(p){ return p.id === targetFolderId2; });
    if(!targetFolder2) return;
    if(targetFolder2 === srcFolder) return;
    srcFolder.themes.splice(srcIdx, 1);
    targetFolder2.themes.push(theme);
  }

  save();
  renderFoldersEditor();
  renderPromptTags();
  renderThemeTags();
  showToast('移動しました');
}

function cleanupThemeDrag(){
  if(themeDrag){
    if(themeDrag.ghost && themeDrag.ghost.parentNode) themeDrag.ghost.parentNode.removeChild(themeDrag.ghost);
    if(themeDrag.themeCard) themeDrag.themeCard.style.opacity = '';
  }
  $$('.theme-drop-over, .theme-drop-before, .theme-drop-after').forEach(function(el){
    el.classList.remove('theme-drop-over', 'theme-drop-before', 'theme-drop-after');
  });
  themeDrag = null;
}

      var entry = getEntry(currentId);
      var dur = isFinite(audio.duration) && audio.duration > 0
        ? audio.duration : (entry && entry.audioDuration) || 0;
      if(dur && pTime) pTime.textContent = fmtTime(p * dur) + ' / ' + fmtTime(dur);
    });
    seekEl.addEventListener('change', function(){
      var p = Number(seekEl.value) / 1000;
      var dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
      if(dur) audio.currentTime = p * dur;
      scrubbing = false;
      setSeekUI();
      if(currentId){
        audioPositions[currentId] = audio.currentTime || 0;
        if(db) dbSavePos(currentId, audioPositions[currentId]).catch(function(){});
      }
      updatePositionState();
    });
  }

  // ─── Audio events ───
  audio.addEventListener('play', function(){
    document.body.classList.add('is-playing');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    renderHistory();
    updatePlayer();
  });
  audio.addEventListener('pause', function(){
    document.body.classList.remove('is-playing');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    renderHistory();
    updatePlayer();
    if(currentId){
      audioPositions[currentId] = audio.currentTime || 0;
      if(db) dbSavePos(currentId, audioPositions[currentId]).catch(function(){});
    }
  });
  audio.addEventListener('loadedmetadata', function(){
    if(currentId){
      var entry = getEntry(currentId);
      if(entry && isFinite(audio.duration) && audio.duration > 0 &&
         Math.abs((entry.audioDuration || 0) - audio.duration) > 0.5){
        entry.audioDuration = audio.duration;
        save();
        renderHistory();
      }
    }
    setSeekUI();
    updatePositionState();
  });
  audio.addEventListener('timeupdate', function(){
    if(currentId) audioPositions[currentId] = audio.currentTime;
    if(!scrubbing) setSeekUI();
    updatePositionState();
  });
  audio.addEventListener('ended', onEnded);
  audio.addEventListener('error', function(){ showToast('この音声を再生できませんでした'); });

  window.addEventListener('pagehide', function(){
    if(currentId){
      audioPositions[currentId] = audio.currentTime || 0;
      if(db) dbSavePos(currentId, audioPositions[currentId]).catch(function(){});
    }
  });

  setupMediaSession();

  // ─── ドラッグ&ドロップ (音声) ───
  var dragDepth = 0;
  var overlay = $('#dropOverlay');
  window.addEventListener('dragenter', function(e){
    if(!e.dataTransfer || Array.from(e.dataTransfer.types || []).indexOf('Files') === -1) return;
    e.preventDefault();
    dragDepth++;
    if(overlay) overlay.classList.add('show');
  });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('dragleave', function(e){
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if(dragDepth === 0 && overlay) overlay.classList.remove('show');
  });
  window.addEventListener('drop', function(e){
    e.preventDefault();
    dragDepth = 0;
    if(overlay) overlay.classList.remove('show');
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      handleAudioDrop(e.dataTransfer.files[0]);
    }
  });
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){ e.preventDefault(); });

  // ダブルタップズーム抑止
  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if(now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive:false });

  // 生成中タブへの自動遷移用に定期リフレッシュ（1分毎）
  setInterval(function(){
    if(document.visibilityState === 'visible') renderHistory();
  }, 60000);
});

})();
</script>
</body>
</html>
