<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyCast">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>MyCast</title>
<link rel="apple-touch-icon" id="appleIcon">
<link rel="manifest" id="manifestLink">
<style>
  :root{
    --bg:#0a0a0c; --bg2:#131316; --card:#1c1c1e; --card2:#2c2c2e;
    --text:#fff; --text2:#8e8e93; --text3:#48484a;
    --accent:#6c7bff; --accent2:#b06cff; --accent-soft:rgba(108,123,255,.15);
    --grad:linear-gradient(135deg,#5b6cff,#9a6cff);
    --grad-soft:linear-gradient(140deg,rgba(91,108,255,.14),rgba(176,108,255,.06));
    --green:#30d158; --red:#ff453a;
    --border:rgba(255,255,255,.08);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    min-height:100%;overscroll-behavior:none}
  body{
    padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 280px);
    max-width:480px;margin:0 auto;min-height:100dvh;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:manipulation;
  }
  body.modal-open{overflow:hidden;overscroll-behavior:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 55% at 50% -12%, rgba(108,123,255,.16), transparent 62%),
      radial-gradient(90% 45% at 105% 108%, rgba(176,108,255,.10), transparent 62%);
  }
  .app-wrap{position:relative;z-index:1}

  /* ── Number pill (【009】の代替) ── */
  .num-pill{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:30px;height:18px;padding:0 8px;margin-right:6px;
    border-radius:99px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:11px;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:.03em;
    vertical-align:middle;position:relative;top:-1px;
    line-height:1;
  }
  .history-item.playing .num-pill{background:rgba(255,255,255,.22);color:#fff}
  .genBtn .num-pill{background:rgba(255,255,255,.28);color:#fff}
  .ptitle .num-pill{margin-right:5px}

  /* ── Topbar ── */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px;gap:12px}
  .titleWrap{min-width:0}
  .topbar h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.03em;line-height:1.1}
  .subtitle{margin:4px 0 0;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.02em}
  .topbar-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .icon-btn{width:48px;height:48px;border-radius:50%;background:var(--card);border:none;color:var(--text);
    font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;
    position:relative;z-index:2;transition:transform .12s,background .12s}
  .icon-btn:active{transform:scale(.9);background:var(--card2)}
  .icon-badge{
    position:absolute;top:2px;right:2px;
    background:var(--red);color:#fff;
    font-size:9px;font-weight:700;
    padding:1px 5px;border-radius:99px;
    min-width:14px;height:14px;
    display:none;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;line-height:1;
    box-shadow:0 0 0 2px var(--bg);
    z-index:3;
  }
  .icon-badge.show{display:inline-flex}

  /* ── Main tabs ── */
  .main-tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:16px}
  .main-tab{flex:1;padding:10px 2px;border:none;border-radius:9px;background:transparent;color:var(--text2);
    font-size:12.5px;font-weight:650;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none;transition:background .15s,color .15s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;justify-content:center;gap:4px}
  .main-tab.is-active{background:var(--accent);color:#fff}
  .main-tab .tab-count{
    font-size:10px;font-weight:700;background:rgba(255,255,255,.18);
    padding:1px 6px;border-radius:99px;min-width:16px;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .main-tab.is-active .tab-count{background:rgba(255,255,255,.28)}

  .main-panel[hidden]{display:none}

  /* ── Section ── */
  .section{margin-bottom:18px}
  .step-label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text2);
    margin-bottom:10px;letter-spacing:.04em;flex-wrap:wrap}
  .step-num{display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    font-size:12px;font-weight:700;flex-shrink:0}
  .step-label.is-active{color:var(--accent)}
  .step-label.is-active .step-num{background:var(--accent);color:#fff}
  .hint{color:var(--text3);font-weight:400;font-size:11px;margin-left:4px}

  /* ── Tags ── */
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);
    color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:background .15s,border-color .15s,transform .1s;
    -webkit-appearance:none;appearance:none;touch-action:manipulation;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .tag:active{transform:scale(.96)}
  .tag[data-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* ── Generate button ── */
  .genBtn{
    display:block;width:100%;min-height:100px;padding:18px 20px;
    background:var(--grad);color:#fff;border:none;border-radius:20px;
    text-align:center;box-sizing:border-box;cursor:pointer;
    box-shadow:0 10px 28px rgba(91,108,255,.40);
    transition:transform .12s,opacity .12s;font-family:inherit;
    -webkit-appearance:none;appearance:none;
  }
  .genBtn:active{transform:scale(.98);opacity:.9}
  .genBtn:disabled{opacity:.55;cursor:default}
  .genBtn .icon{display:block;font-size:32px;line-height:1;margin-bottom:6px;color:#fff}
  .genBtn .main{display:block;font-size:17px;font-weight:700;line-height:1.4;color:#fff}

  /* ── Clear played ── */
  .clear-played-wrap{margin-bottom:10px}
  .clear-played-btn{width:100%;padding:10px;border-radius:10px;border:none;
    background:rgba(255,69,58,.12);color:#ff7070;font-size:13px;font-weight:650;
    font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
  .clear-played-btn:active{background:rgba(255,69,58,.22)}

  /* ── History ── */
  .history{display:flex;flex-direction:column;gap:8px}
  .history-date-header{
    font-size:12.5px;font-weight:700;color:var(--text2);
    padding:14px 4px 6px;letter-spacing:.02em;
    display:flex;align-items:center;gap:10px;
  }
  .history-date-header:first-child{padding-top:4px}
  .history-date-header::after{
    content:"";flex:1;height:1px;background:var(--border);
  }
  .history-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--card);border-radius:16px;border:1px solid var(--border);
    transition:background .18s,border-color .18s,transform .12s,opacity .2s;
    cursor:pointer;position:relative;overflow:hidden;
  }
  .history-item:active{transform:scale(.985)}
  .history-item.playing{background:rgba(108,123,255,.15);border-color:rgba(108,123,255,.38)}
  .history-item.read:not(.playing){opacity:.55}
  .history-item .thumb{
    flex:0 0 42px;width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);border:1px solid rgba(108,123,255,.20);
    color:#c8cfff;font-size:15px;font-weight:700;cursor:pointer;
    -webkit-appearance:none;appearance:none;padding:0;font-family:inherit;
    transition:transform .12s,background .12s;
  }
  .history-item .thumb:active{transform:scale(.92)}
  .history-item.playing .thumb{background:var(--grad);color:#fff;border-color:transparent}
  .history-item .thumb svg{width:18px;height:18px}
  .history-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .history-title{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px;font-weight:600;line-height:1.35;word-break:break-word;
    align-items:center;
  }
  .history-title .num-pill{vertical-align:middle}
  .history-sub{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:11.5px;color:var(--text2);
    font-variant-numeric:tabular-nums;
  }
  .history-time{
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .history-gen{
    display:inline-block;font-size:9.5px;font-weight:600;
    color:var(--text3);
    background:rgba(255,255,255,.07);
    padding:0 5px;border-radius:4px;margin-left:5px;
    vertical-align:middle;position:relative;top:-1px;
    letter-spacing:.02em;
  }
  .history-dur{
    flex:0 0 auto;text-align:right;font-weight:600;color:var(--text2);
    white-space:nowrap;
  }
  .history-del{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:transparent;
    border:none;color:var(--text2);font-size:14px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-family:inherit;padding:0;-webkit-appearance:none;appearance:none;
    transition:background .12s,color .12s}
  .history-del:active{background:rgba(255,69,58,.15);color:var(--red)}
  .history-bar{position:absolute;left:0;bottom:0;height:2px;background:var(--grad);
    border-radius:0 1px 1px 0;transition:width .3s linear}
  .empty{color:var(--text3);font-size:13.5px;padding:24px 0;text-align:center}
  .empty small{display:block;font-size:11.5px;margin-top:6px;color:var(--text3)}

  .eq{display:flex;align-items:flex-end;justify-content:center;gap:2.5px;height:14px;color:#fff}
  .eq i{display:block;width:2.5px;border-radius:1.5px;background:currentColor;
    transform-origin:bottom;animation:eqb .85s ease-in-out infinite alternate;
    animation-play-state:paused}
  .eq i:nth-child(1){height:45%;animation-delay:-.20s}
  .eq i:nth-child(2){height:92%;animation-delay:-.52s}
  .eq i:nth-child(3){height:64%;animation-delay:-.08s}
  .eq i:nth-child(4){height:100%;animation-delay:-.70s}
  .history-item.playing .eq i{animation-play-state:running}
  .player.show .pthumb .eq i{animation-play-state:running}
  @keyframes eqb{from{transform:scaleY(.22)}to{transform:scaleY(1)}}

  /* ── Player ── */
  .player{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:10px 14px calc(var(--safe-bottom) + 10px);
    background:rgba(20,20,25,.82);
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    border-top:1px solid rgba(255,255,255,.09);
    box-shadow:0 -12px 40px rgba(0,0,0,.55);
    transform:translateY(115%);
    transition:transform .38s cubic-bezier(.32,.72,0,1);
    will-change:transform;
  }
  .player.show{transform:translateY(0)}

  .phead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .pthumb{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;color:#fff;
    background:var(--grad);box-shadow:0 6px 16px rgba(91,108,255,.30)}
  .pmeta{flex:1;min-width:0}
  .ptitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px;font-weight:650;line-height:1.3;word-break:break-word}
  .psub{font-size:11px;color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums}

  .seekRow{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .seek{-webkit-appearance:none;appearance:none;flex:1;height:20px;margin:0;background:transparent;min-width:0}
  .seek::-webkit-slider-runnable-track{height:5px;border-radius:3px;
    background:linear-gradient(90deg,#5b6cff 0%,#9a6cff var(--p,0%),rgba(255,255,255,.13) var(--p,0%),rgba(255,255,255,.13) 100%)}
  .seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;
    margin-top:-4.5px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
  .seek::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.13)}
  .seek::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:#fff}
  .ptime-current,.ptime-total{
    font-size:11px;font-weight:600;color:var(--text2);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
    flex:0 0 auto;min-width:38px;
  }
  .ptime-current{text-align:left}
  .ptime-total{text-align:right}

  .pctrl{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 4px}
  .btn{width:44px;height:44px;border:none;background:transparent;color:var(--text);
    display:grid;place-items:center;border-radius:50%;padding:0;
    transition:transform .12s,opacity .12s,background .12s}
  .btn:active{transform:scale(.9);opacity:.65}
  .btn svg{width:20px;height:20px}
  .btn.play{width:52px;height:52px;border-radius:50%;color:#fff;background:var(--grad);
    box-shadow:0 8px 22px rgba(91,108,255,.42)}
  .btn.play svg{width:22px;height:22px}
  #playBtn .ico-pause{display:none}
  body.is-playing #playBtn .ico-play{display:none}
  body.is-playing #playBtn .ico-pause{display:block}
  .skipBtn{width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);
    color:var(--text);font-size:12.5px;font-weight:700;letter-spacing:-.02em;
    display:grid;place-items:center;padding:0;
    transition:transform .12s,background .12s;font-family:inherit;
    flex:0 0 auto}
  .skipBtn:active{transform:scale(.9);background:rgba(108,123,255,.22)}
  .skipBtn svg{width:16px;height:16px}

  .pfoot{display:flex;align-items:center;gap:8px;padding:0 2px}
  .repBtn{position:relative;width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:transparent;border:none;color:var(--text2);
    display:grid;place-items:center;padding:0;
    transition:color .15s,background .15s,box-shadow .15s}
  .repBtn svg{width:17px;height:17px}
  .repBtn.on{
    color:#fff;
    background:var(--accent);
    box-shadow:0 2px 10px rgba(108,123,255,.55),inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .repBtn.on:active{background:var(--accent2)}
  .repNum{position:absolute;bottom:1px;right:1px;font-size:8px;font-weight:800;color:#fff;
    background:var(--accent2);width:11px;height:11px;border-radius:50%;
    display:none;place-items:center;line-height:1;
    box-shadow:0 0 0 1.5px var(--bg2)}
  .repBtn.one .repNum{display:grid}
  .spdLabel{font-size:11px;font-weight:600;color:var(--text2);flex:0 0 auto}
  .spdRange{flex:1;-webkit-appearance:none;appearance:none;height:18px;margin:0;background:transparent}
  .spdRange::-webkit-slider-runnable-track{height:4px;border-radius:2px;
    background:linear-gradient(90deg,#5b6cff 0%,#9a6cff var(--p,20%),rgba(255,255,255,.13) var(--p,20%),rgba(255,255,255,.13) 100%)}
  .spdRange::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;
    margin-top:-4.5px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
  .spdRange::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
  .spdRange::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff}
  .spdValue{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
    min-width:40px;text-align:right;flex:0 0 auto;letter-spacing:-.01em}
  .miniBtn{height:26px;padding:0 9px;border-radius:8px;border:none;
    background:rgba(255,255,255,.08);color:var(--text);
    font-size:11px;font-weight:650;flex:0 0 auto;font-family:inherit}
  .miniBtn:active{background:rgba(108,123,255,.28)}

  /* ── Modal (settings) ── */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:100;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s;
    overscroll-behavior:contain;touch-action:none}
  .modal.show{opacity:1;visibility:visible;pointer-events:auto}
  .modal-card{width:100%;height:92vh;max-height:92vh;background:var(--bg2);
    border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;
    touch-action:auto;overscroll-behavior:contain}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    padding:20px 16px 14px;flex:0 0 auto}
  .modal-head h2{font-size:20px;font-weight:700;margin:0}

  .tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;
    margin:0 16px 14px;flex:0 0 auto}
  .tab-btn{flex:1;padding:10px;border-radius:9px;border:none;background:transparent;color:var(--text2);
    font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none;position:relative;
    display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .tab-btn.is-active{background:var(--accent);color:#fff}
  .tab-badge{
    display:none;background:var(--red);color:#fff;
    font-size:9.5px;font-weight:700;
    padding:1px 5px;border-radius:99px;
    min-width:16px;text-align:center;
    font-variant-numeric:tabular-nums;
    line-height:1.2;
  }
  .tab-badge.show{display:inline-block}
  .tab-panel[hidden]{display:none}
  .tab-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 16px calc(var(--safe-bottom) + 20px);overscroll-behavior:contain;
    touch-action:pan-y}

  .field{margin-bottom:20px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px}
  .hint2{color:var(--text3);font-weight:400;font-size:12px;margin-left:6px}
  textarea,input[type="text"]{width:100%;background:var(--card);border:1px solid var(--border);
    border-radius:12px;color:var(--text);padding:12px;font-size:15px;font-family:inherit;
    resize:vertical;outline:none;box-sizing:border-box;-webkit-appearance:none;line-height:1.5}
  textarea:focus,input[type="text"]:focus{border-color:var(--accent)}
  #commonPromptInput{min-height:440px}

  .note{color:var(--text3);font-size:12px;line-height:1.6;margin:0 0 12px}
  .data-btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--accent-soft);
    color:var(--accent);border:1px solid var(--border);font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;margin-bottom:10px;-webkit-appearance:none;appearance:none}
  .data-btn:active{background:rgba(108,123,255,.28)}
  .data-btn.skip-style{background:transparent;color:var(--text2);border:1px solid var(--border)}

  /* ── Settings folder view (compact) ── */
  .settings-folder{
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--border);
    margin-bottom:12px;
    overflow:hidden;
    transition:box-shadow .15s,background .15s;
  }
  .settings-folder.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
  .settings-folder.drop-after{box-shadow:0 3px 0 0 var(--accent)}
  .settings-folder.drop-over{box-shadow:0 0 0 2px var(--accent);background:rgba(108,123,255,.08)}

  .folder-head-row{
    display:flex;align-items:center;gap:8px;padding:12px;
    cursor:pointer;transition:background .12s;
    -webkit-user-select:none;user-select:none;
  }
  .folder-head-row:active{background:rgba(255,255,255,.04)}

  .folder-toggle{
    width:26px;height:26px;border-radius:7px;border:none;
    background:transparent;color:var(--text2);font-size:9px;
    display:grid;place-items:center;padding:0;flex:0 0 auto;
    -webkit-appearance:none;appearance:none;font-family:inherit;
    transition:background .12s,color .12s;
  }
  .folder-toggle:active{background:var(--accent-soft);color:var(--accent)}

  .folder-name-label{
    flex:1;font-size:15px;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .folder-count-label{
    font-size:11.5px;color:var(--text2);background:var(--bg2);
    padding:2px 8px;border-radius:8px;flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .drag-grip{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    color:var(--text3);cursor:grab;touch-action:none;font-size:16px;border-radius:6px;
    flex-shrink:0;-webkit-user-select:none;user-select:none;
    transition:background .12s,color .12s;
    order:10;
  }
  .drag-grip:active{background:var(--accent-soft);color:var(--accent);cursor:grabbing}

  .themes-list{padding:0 12px 12px}
  .theme-item{
    display:flex;align-items:center;gap:6px;padding:8px 8px 8px 6px;
    margin-left:24px;background:var(--bg2);border-radius:8px;margin-bottom:6px;
    cursor:pointer;transition:box-shadow .15s,background .12s;
    -webkit-user-select:none;user-select:none;
  }
  .theme-item:active{background:rgba(255,255,255,.06)}
  .theme-item.drop-before{box-shadow:0 -2px 0 0 var(--accent)}
  .theme-item.drop-after{box-shadow:0 2px 0 0 var(--accent)}
  .theme-item .drag-grip{width:28px;height:28px;font-size:14px;order:10}
  .theme-text-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .theme-name-label{
    flex:1;font-size:13px;font-weight:500;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .theme-source-preview{
    font-size:11px;color:var(--text3);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    max-width:100%;
  }

  .empty-themes{
    margin-left:24px;padding:8px;color:var(--text3);font-size:12px;text-align:center;
    border:1px dashed var(--border);border-radius:8px;margin-bottom:8px;
  }
  .add-theme-inline{
    margin-left:24px;padding:8px;border-radius:8px;background:transparent;
    border:1px dashed var(--border);color:var(--text2);font-size:12px;font-weight:600;
    font-family:inherit;cursor:pointer;width:calc(100% - 24px);
    -webkit-appearance:none;appearance:none;
  }
  .add-theme-inline:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

  .add-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    border:1px dashed var(--accent);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none}

  /* ── Edit modal (large sheet) ── */
  .edit-modal{z-index:110}
  .edit-modal-card{width:100%;height:90vh;max-height:90vh;background:var(--bg2);
    border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;
    touch-action:auto;overscroll-behavior:contain}
  .edit-modal-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 16px;overscroll-behavior:contain;touch-action:pan-y}
  .edit-modal-foot{padding:16px;padding-bottom:calc(var(--safe-bottom) + 16px);
    border-top:1px solid var(--border);flex-shrink:0}
  .delete-btn{width:100%;padding:14px;border-radius:12px;
    background:rgba(255,69,58,.12);color:#ff7070;border:none;
    font-size:15px;font-weight:650;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none}
  .delete-btn:active{background:rgba(255,69,58,.25)}
  .edit-modal-scroll textarea{min-height:220px}

  /* ── Match modal (audio file picker) ── */
  .match-modal{z-index:120}
  .match-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 16px calc(var(--safe-bottom) + 20px);
    overscroll-behavior:contain;touch-action:pan-y}
  .match-file-info{background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:12px;margin-bottom:14px}
  .match-file-name{font-size:14px;font-weight:600;line-height:1.4;word-break:break-word}
  .match-file-hint{font-size:11.5px;color:var(--text2);margin-top:4px}
  .match-candidates{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .match-cand{display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    text-align:left;font-family:inherit;color:var(--text);cursor:pointer;
    -webkit-appearance:none;appearance:none;width:100%;
    transition:background .12s,border-color .12s,transform .1s}
  .match-cand:active{background:var(--card2);transform:scale(.99)}
  .match-cand-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .match-cand-title{font-size:13.5px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;align-items:center;gap:6px}
  .match-cand-sub{font-size:11px;color:var(--text2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .match-cand-score{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;background:var(--accent-soft);
    padding:2px 8px;border-radius:99px}
  .match-empty{color:var(--text3);font-size:12.5px;padding:16px 0;text-align:center}

  /* ── Drag ghost ── */
  .drag-ghost{position:fixed;pointer-events:none;z-index:1000;opacity:.92;
    transform:rotate(1.5deg);box-shadow:0 12px 40px rgba(0,0,0,.65);
    border-radius:10px;background:var(--bg2);border:2px solid var(--accent);
    padding:10px 14px;font-size:13px;font-weight:600;color:var(--text);
    max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── Toast ── */
  .toast{position:fixed;left:50%;top:calc(var(--safe-top) + 76px);
    transform:translateX(-50%) translateY(-20px);background:var(--card2);color:var(--text);
    padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;
    transition:opacity .22s,transform .22s;pointer-events:none;z-index:200;white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:90vw;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:10px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toastAction{border:none;background:rgba(108,123,255,.32);color:#c8cfff;
    font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:8px;flex:0 0 auto;white-space:nowrap}
  .toastAction:active{background:rgba(108,123,255,.5)}

  /* ── Drop overlay ── */
  .drop-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;
    background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:opacity .18s}
  .drop-overlay.show{opacity:1}
  .drop-overlay div{padding:44px 56px;border:2px dashed rgba(140,150,255,.75);border-radius:28px;
    font-size:17px;font-weight:700;color:#cfd4ff;background:rgba(108,123,255,.10);
    text-align:center;line-height:1.6}
  .drop-overlay small{display:block;font-size:12px;font-weight:500;color:#a8b0d8;margin-top:8px}
</style>
</head>
<body>

<div class="app-wrap">
  <header class="topbar">
    <div class="titleWrap">
      <h1>MyCast</h1>
      <p class="subtitle" id="subtitle">音声解説 × プレイヤー</p>
    </div>
    <div class="topbar-actions">
      <button id="notebookBtn" type="button" class="icon-btn" aria-label="NotebookLM を開く" title="NotebookLM を開く">📓</button>
      <button id="settingsBtn" type="button" class="icon-btn" aria-label="設定">⚙<span class="icon-badge" id="settingsBadge"></span></button>
    </div>
  </header>

  <main>
    <div class="main-tabs" id="mainTabs">
      <button class="main-tab is-active" data-tab="new">新規</button>
      <button class="main-tab" data-tab="generating">生成中<span class="tab-count" style="display:none">0</span></button>
      <button class="main-tab" data-tab="unplayed">未再生<span class="tab-count" style="display:none">0</span></button>
      <button class="main-tab" data-tab="played">再生済<span class="tab-count" style="display:none">0</span></button>
    </div>

    <!-- 新規（ワークフロー） -->
    <div id="panelNew" class="main-panel">
      <section class="section">
        <div class="step-label is-active"><span class="step-num">1</span>プロンプト<span class="hint">長押しで編集</span></div>
        <div id="promptTags" class="tags"></div>
      </section>

      <section class="section">
        <div class="step-label is-active"><span class="step-num">2</span>テーマを選択<span class="hint">長押しで編集</span></div>
        <div id="tags" class="tags"></div>
      </section>

      <section class="section">
        <div class="step-label is-active"><span class="step-num">3</span>音声解説を生成する</div>
        <button id="shareBtn" type="button" class="genBtn" aria-label="音声解説を生成する">
          <span class="icon">🎙</span>
          <span class="main" id="shareBtnTitle"><span class="num-pill">001</span>音声解説を生成する</span>
        </button>
      </section>
    </div>

    <!-- 生成中 -->
    <div id="panelGenerating" class="main-panel" hidden>
      <div id="listGenerating" class="history"></div>
    </div>

    <!-- 未再生 -->
    <div id="panelUnplayed" class="main-panel" hidden>
      <div id="listUnplayed" class="history"></div>
    </div>

    <!-- 再生済 -->
    <div id="panelPlayed" class="main-panel" hidden>
      <div id="clearPlayedWrap" class="clear-played-wrap" style="display:none">
        <button id="clearPlayedBtn" type="button" class="clear-played-btn">再生済みをすべて削除</button>
      </div>
      <div id="listPlayed" class="history"></div>
    </div>
  </main>
</div>

<!-- プレイヤー -->
<div class="player" id="player">
  <div class="phead">
    <div class="pthumb"><div class="eq"><i></i><i></i><i></i><i></i></div></div>
    <div class="pmeta">
      <div class="ptitle" id="pTitle">—</div>
      <div class="psub" id="pSub">—</div>
    </div>
  </div>
  <div class="seekRow">
    <span class="ptime-current" id="pCurrent">0:00</span>
    <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="再生位置">
    <span class="ptime-total" id="pTotal">0:00</span>
  </div>
  <div class="pctrl">
    <button class="skipBtn" id="headBtn" aria-label="頭出し">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19 5.5v13c0 .8-.9 1.3-1.6.9L9.4 12.9a1 1 0 0 1 0-1.8l8-6.5c.7-.4 1.6.1 1.6.9z"/></svg>
    </button>
    <button class="skipBtn" id="back15Btn" aria-label="15秒戻す">−15</button>
    <button class="btn play" id="playBtn" aria-label="再生 / 一時停止">
      <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .8.87 1.29 1.56.9l10.9-6.86a1.05 1.05 0 0 0 0-1.8L9.56 4.24A1.05 1.05 0 0 0 8 5.14Z"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.6" height="15" rx="1.7"/><rect x="13.4" y="4.5" width="4.6" height="15" rx="1.7"/></svg>
    </button>
    <button class="skipBtn" id="fwd15Btn" aria-label="15秒進む">+15</button>
  </div>
  <div class="pfoot">
    <button class="repBtn" id="repeatBtn" aria-label="リピート切替">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
        <path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
      </svg>
      <span class="repNum" id="repNum">1</span>
    </button>
    <span class="spdLabel">速度</span>
    <input type="range" class="spdRange" id="speedSlider" min="0.5" max="3" step="0.1" value="1" aria-label="再生速度">
    <span class="spdValue" id="speedValue">1.0×</span>
    <button class="miniBtn" id="resetSpeedBtn">1×</button>
  </div>
</div>

<!-- 設定モーダル -->
<div id="settingsModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>設定</h2>
      <button id="closeSettings" type="button" class="icon-btn" aria-label="閉じる">✕</button>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn is-active" data-tab="folders">個別プロンプト</button>
      <button type="button" class="tab-btn" data-tab="common">共通プロンプト</button>
      <button type="button" class="tab-btn" data-tab="data">データ<span class="tab-badge" id="dataTabBadge"></span></button>
    </div>

    <div class="tab-scroll">
      <div id="tabFolders" class="tab-panel">
        <p class="note">▶ でテーマ一覧を開閉。⠿ をドラッグで並び替え・別プロンプトへ移動。行をタップで編集。</p>
        <div id="foldersList"></div>
        <button id="addFolderBtn" type="button" class="add-btn" style="margin-top:12px">+ 個別プロンプトを追加</button>
      </div>

      <div id="tabCommon" class="tab-panel" hidden>
        <div class="field">
          <label>共通プロンプト<span class="hint2">各個別プロンプトと結合してコピーされます</span></label>
          <textarea id="commonPromptInput" rows="16" placeholder="共通プロンプト本文（{theme} でテーマ名を差し込み）"></textarea>
        </div>
      </div>

      <div id="tabData" class="tab-panel" hidden>
        <div class="field">
          <label>バックアップ</label>
          <p class="note">個別プロンプト・テーマを JSON ファイルに保存できます。履歴と音声ファイル本体は含まれません。</p>
          <button id="exportBtn" type="button" class="data-btn">エクスポート（ファイルに保存）</button>
          <button id="importBtn" type="button" class="data-btn">インポート（ファイルから復元）</button>
          <input id="importFile" type="file" accept=".json,application/json" hidden>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 編集モーダル（個別プロンプト／テーマ） -->
<div id="editModal" class="modal edit-modal">
  <div class="edit-modal-card">
    <div class="modal-head">
      <h2 id="editModalTitle">編集</h2>
      <button id="editModalClose" type="button" class="icon-btn" aria-label="閉じる">✕</button>
    </div>
    <div class="edit-modal-scroll">
      <div class="field">
        <label>名前</label>
        <input type="text" id="editModalName" placeholder="名前">
      </div>
      <div class="field">
        <label id="editModalTextLabel">本文</label>
        <textarea id="editModalText" rows="12"></textarea>
      </div>
    </div>
    <div class="edit-modal-foot">
      <button id="editModalDelete" type="button" class="delete-btn">削除</button>
    </div>
  </div>
</div>

<!-- 音声ファイル紐づけ選択モーダル -->
<div id="matchModal" class="modal match-modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>音声ファイルの紐づけ</h2>
      <button id="matchModalClose" type="button" class="icon-btn" aria-label="閉じる">✕</button>
    </div>
    <div class="match-scroll">
      <div class="match-file-info">
        <div class="match-file-name" id="matchFileName"></div>
        <div class="match-file-hint">紐づける生成中データを選択してください</div>
      </div>
      <div id="matchCandidates" class="match-candidates"></div>
      <button id="matchNewBtn" type="button" class="data-btn">新規として追加</button>
      <button id="matchSkipBtn" type="button" class="data-btn skip-style">スキップ（このファイルを無視）</button>
    </div>
  </div>
</div>

<div class="drop-overlay" id="dropOverlay">
  <div>音声ファイルをドロップ<small>複数ファイル対応・名前の一致率で自動紐づけ</small></div>
</div>
<div id="toast" class="toast"></div>

<input type="file" id="fileInput" accept="audio/*,.m4a,.mp3,.aac,.wav,.m4b,.ogg,.oga,.flac,.opus" hidden>
<audio id="audio" playsinline preload="metadata"></audio>

<script>
(function(){
'use strict';

/* ═════════════════════════════════════════════
   MyCast — 統合版 v4
   ═════════════════════════════════════════════ */

var STORAGE_KEY = 'mycast.v4';
var LEGACY_KEYS = ['mycast.v3','mycast.v2','mycast.v1','nblink.v9','nblink.v8','nblink.v7'];
var MAX_HISTORY = 200;
var REUSE_WINDOW_MS = 30000;
var NOTEBOOK_URL = 'https://notebooklm.google.com/';
var LONG_PRESS_MS = 550;
var DEFAULT_PROMPT = '以下のソースを参考に、テーマ「{theme}」について音声でわかりやすく解説してください。';
var ICON_FILE = 'icon.png';
var TABS = ['new', 'generating', 'unplayed', 'played'];

var AUTO_MATCH_THRESHOLD = 0.62;
var AUTO_MATCH_MARGIN = 0.12;
var MIN_CANDIDATE_SCORE = 0.15;

function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }

/* ── State ── */
var state = {
  commonPrompt: '',
  prompts: [],
  history: [],
  selectedPromptId: null,
  selectedThemeId: null,
  lastGenAt: 0,
  lastGenId: null,
  nextNumber: 1,
  rate: 1,
  repeatMode: 'off',
  mainTab: 'new',
  lastExportSnapshot: null
};

var currentId = null;
var audioUrls = {};
var audioPositions = {};
var scrubbing = false;
var toastTimer = null;
var suppressClickUntil = 0;
var db = null;
var ICON_ABS = '';
var settingsDrag = null;
var settingsAutoScrollRAF = null;
var editing = { type: null, folderId: null, themeId: null };
var generatingLock = false;
var pendingMatchResolve = null;

/* ── Utils ── */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function formatNum(n){ return String(n).padStart(3, '0'); }
function numTag(n){ return '【' + formatNum(n) + '】'; }
function numPill(n){ return '<span class="num-pill">' + formatNum(n) + '</span>'; }
function safeId(v){ return (typeof v === 'string' && /^[A-Za-z0-9_-]+$/.test(v)) ? v : null; }
function fmtTime(s){
  if(!isFinite(s) || s < 0) return '0:00';
  s = Math.floor(s);
  var h = Math.floor(s/3600);
  var m = Math.floor((s%3600)/60);
  var ss = String(s%60).padStart(2,'0');
  return h > 0 ? (h+':'+String(m).padStart(2,'0')+':'+ss) : (m+':'+ss);
}
function formatDateLabel(d){
  var days = ['日','月','火','水','木','金','土'];
  return (d.getMonth()+1)+'月'+d.getDate()+'日('+days[d.getDay()]+') '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtRate(r){ return r.toFixed(1) + '×'; }

function showToast(msg, actionLabel, actionFn, duration){
  var el = $('#toast'); if(!el) return;
  el.innerHTML = '';
  var span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(actionLabel && actionFn){
    var btn = document.createElement('button');
    btn.className = 'toastAction';
    btn.textContent = actionLabel;
    btn.addEventListener('click', function(){ actionFn(); hideToast(); });
    el.appendChild(btn);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, duration || (actionLabel ? 5000 : 2200));
}
function hideToast(){
  var el = $('#toast'); if(el) el.classList.remove('show');
  clearTimeout(toastTimer);
}

/* ── Filename helpers ── */
function cleanTitleFromFile(name){
  return String(name || '').replace(/\.[^.]+$/, '').trim() || '(無題)';
}

/* ── テキスト類似度 ── */
function normalizeForMatch(s){
  return String(s || '')
    .replace(/【\d+】/g, ' ')
    .replace(/[\s\u3000_\-\.\u30fb\u30fc\uff0d\/／・、。！？!?,]/g, '')
    .replace(/[「」『』（）()\[\]【】]/g, '')
    .toLowerCase();
}
function bigrams(s){
  var arr = [];
  var len = s.length;
  if(len === 0) return arr;
  if(len === 1){ arr.push(s); return arr; }
  for(var i=0; i<len-1; i++) arr.push(s.slice(i, i+2));
  return arr;
}
function diceCoefficient(a, b){
  var A = bigrams(a), B = bigrams(b);
  if(!A.length || !B.length) return 0;
  var countB = {};
  B.forEach(function(g){ countB[g] = (countB[g]||0) + 1; });
  var inter = 0;
  A.forEach(function(g){
    if(countB[g] > 0){ inter++; countB[g]--; }
  });
  return (2 * inter) / (A.length + B.length);
}
function scoreEntryMatch(baseName, entry){
  var base = normalizeForMatch(baseName);
  if(!base) return 0;
  var fields = [entry.themeName, entry.title, entry.folderName].filter(Boolean);
  var best = 0;
  fields.forEach(function(f){
    var n = normalizeForMatch(f);
    if(!n) return;
    var s = diceCoefficient(base, n);
    if(n.length >= 3 && base.length >= 3){
      if(n.indexOf(base) !== -1 || base.indexOf(n) !== -1){
        s = Math.max(s, 0.75);
      }
    }
    if(s > best) best = s;
  });
  return best;
}

    var req = indexedDB.open('mycast-db', 1);
    req.onupgradeneeded = function(e){
      var d = e.target.result;
      if(!d.objectStoreNames.contains('audio')) d.createObjectStore('audio', { keyPath: 'id' });
      if(!d.objectStoreNames.contains('positions')) d.createObjectStore('positions', { keyPath: 'id' });
    };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}

    r.onerror = function(){ rej(r.error); };

/* ── Save / Load ── */
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('save failed', e); }
}

function migrateSchema(){
  if(!Array.isArray(state.prompts)) state.prompts = [];
  var needsMigration = false;
  if(state.prompts.length > 0){
    var hasThemesField = state.prompts.some(function(p){ return Array.isArray(p.themes); });
    if(!hasThemesField) needsMigration = true;
  }
  if(needsMigration){
    var oldThemes = Array.isArray(state.themes) ? state.themes : [];
    state.prompts.forEach(function(p, i){
      p.themes = (i === 0) ? oldThemes.slice() : [];
    });
    if(state.prompts.length === 0){
      state.prompts = [{
        id: uid(), name: '標準',
        text: state.commonPrompt || '',
        themes: oldThemes
      }];
      state.commonPrompt = '';
    }
  }
  delete state.themes;
  state.prompts.forEach(function(p){
    if(!Array.isArray(p.themes)) p.themes = [];
  });
}

function normalize(){
  if(typeof state.commonPrompt !== 'string') state.commonPrompt = '';
  if(!Array.isArray(state.prompts)) state.prompts = [];
  if(!Array.isArray(state.history)) state.history = [];

  state.prompts.forEach(function(p){
    if(!safeId(p.id)) p.id = uid();
    if(typeof p.name !== 'string') p.name = '';
    if(typeof p.text !== 'string') p.text = '';
    if(!Array.isArray(p.themes)) p.themes = [];
    if(typeof p.open !== 'boolean') p.open = false;
    p.themes.forEach(function(t){
      if(!safeId(t.id)) t.id = uid();
      if(typeof t.name !== 'string') t.name = '';
      if(typeof t.source !== 'string') t.source = '';
    });
  });

  if(state.prompts.length === 0){
    state.prompts = [{
      id: uid(), name: '標準', text: state.commonPrompt || '',
      themes: [{ id: uid(), name: 'サンプルテーマ',
        source: 'ここにソーステキストを入力してください。Notebook に渡したい本文を貼り付けます。' }],
      open: false
    }];
    if(!state.commonPrompt.trim()) state.commonPrompt = DEFAULT_PROMPT;
  }

  state.history.forEach(function(h){
    if(!safeId(h.id)) h.id = uid();
    if(typeof h.number !== 'number' || !isFinite(h.number)) h.number = 0;
    if(typeof h.title !== 'string') h.title = '';
    if(typeof h.date !== 'string') h.date = '';
    if(typeof h.time !== 'number') h.time = 0;
    if(typeof h.read !== 'boolean') h.read = false;
    if(typeof h.hasAudio !== 'boolean') h.hasAudio = false;
    if(typeof h.audioDuration !== 'number') h.audioDuration = 0;
  });

  if(typeof state.nextNumber !== 'number' || !isFinite(state.nextNumber) || state.nextNumber < 1){
    var maxNum = 0;
    state.history.forEach(function(h){ if(h.number > maxNum) maxNum = h.number; });
    state.nextNumber = maxNum + 1;
  }
  if(typeof state.rate !== 'number' || state.rate < 0.5 || state.rate > 3) state.rate = 1;
  if(['off','all','one'].indexOf(state.repeatMode) === -1) state.repeatMode = 'off';
  if(TABS.indexOf(state.mainTab) === -1) state.mainTab = 'new';
  if(!state.lastExportSnapshot || typeof state.lastExportSnapshot !== 'object'){
    state.lastExportSnapshot = null;
  }

  var selectedFolder = state.prompts.find(function(p){ return p.id === state.selectedPromptId; });
  if(!selectedFolder){
    state.selectedPromptId = state.prompts[0].id;
    selectedFolder = state.prompts[0];
  }
  var themeExists = selectedFolder.themes.some(function(t){ return t.id === state.selectedThemeId; });
  if(!themeExists){
    state.selectedThemeId = selectedFolder.themes[0] ? selectedFolder.themes[0].id : null;
  }

  if(state.history.length > MAX_HISTORY) trimHistory();
}

function trimHistory(){
  if(state.history.length <= MAX_HISTORY) return;
  var removed = state.history.slice(MAX_HISTORY);
  removed.forEach(function(r){
    if(audioUrls[r.id]){ try{ URL.revokeObjectURL(audioUrls[r.id]); }catch(e){} delete audioUrls[r.id]; }
    delete audioPositions[r.id];
    if(db){ dbDelAudio(r.id).catch(function(){}); dbDelPos(r.id).catch(function(){}); }
  });
  state.history = state.history.slice(0, MAX_HISTORY);
}

function load(){
  var parsed = null;
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) parsed = JSON.parse(raw);
    if(!parsed){
      for(var i=0;i<LEGACY_KEYS.length;i++){
        var lv = localStorage.getItem(LEGACY_KEYS[i]);
        if(lv){ try{ parsed = JSON.parse(lv); break; }catch(e){} }
      }
    }
  }catch(e){ parsed = null; }

  if(parsed && typeof parsed === 'object'){
    if(typeof parsed.commonPrompt === 'string') state.commonPrompt = parsed.commonPrompt;
    if(Array.isArray(parsed.prompts)) state.prompts = parsed.prompts;
    if(Array.isArray(parsed.themes)) state.themes = parsed.themes;
    if(Array.isArray(parsed.history)) state.history = parsed.history;
    if(parsed.selectedPromptId) state.selectedPromptId = parsed.selectedPromptId;
    if(parsed.selectedThemeId) state.selectedThemeId = parsed.selectedThemeId;
    if(typeof parsed.lastGenAt === 'number') state.lastGenAt = parsed.lastGenAt;
    if(typeof parsed.lastGenId === 'string') state.lastGenId = parsed.lastGenId;
    if(typeof parsed.nextNumber === 'number') state.nextNumber = parsed.nextNumber;
    if(typeof parsed.rate === 'number') state.rate = parsed.rate;
    if(typeof parsed.repeatMode === 'string') state.repeatMode = parsed.repeatMode;
    if(parsed.lastExportSnapshot && typeof parsed.lastExportSnapshot === 'object'){
      state.lastExportSnapshot = parsed.lastExportSnapshot;
    }
    var tab = parsed.mainTab || parsed.audioTab;
    if(typeof tab === 'string') state.mainTab = tab;
  }
  migrateSchema();
  normalize();
  save();
}

/* ── Export diff tracking ── */
function computeDataSnapshot(){
  return {
    commonPrompt: state.commonPrompt,
    prompts: state.prompts.map(function(f){
      return {
        id: f.id, name: f.name, text: f.text,
        themes: f.themes.map(function(t){
          return { id: t.id, name: t.name, source: t.source };
        })
      };
    })
  };
}

function countDataChanges(){
  if(!state.lastExportSnapshot) return 0;
  var last = state.lastExportSnapshot;
  var count = 0;

  if((last.commonPrompt || '') !== (state.commonPrompt || '')) count++;

  var lastFolders = {};
  (last.prompts || []).forEach(function(f){ lastFolders[f.id] = f; });
  var currentFolders = {};
  state.prompts.forEach(function(f){ currentFolders[f.id] = f; });

  state.prompts.forEach(function(f){
    var prev = lastFolders[f.id];
    if(!prev){ count++; return; }
    var changed = (prev.name !== f.name) || (prev.text !== f.text);
    if(!changed){
      var prevThemes = {};
      (prev.themes || []).forEach(function(t){ prevThemes[t.id] = t; });
      if((prev.themes || []).length !== f.themes.length){
        changed = true;
      } else {
        f.themes.forEach(function(t){
          var pt = prevThemes[t.id];
          if(!pt || pt.name !== t.name || pt.source !== t.source) changed = true;
        });
      }
    }
    if(changed) count++;
  });
  (last.prompts || []).forEach(function(f){
    if(!currentFolders[f.id]) count++;
  });
  return count;
}

function updateDataTabBadge(){
  var n = countDataChanges();
  var dataBadge = $('#dataTabBadge');
  var settingsBadge = $('#settingsBadge');
  var txt = n > 99 ? '99+' : String(n);
  if(dataBadge){
    if(n > 0){ dataBadge.textContent = txt; dataBadge.classList.add('show'); }
    else dataBadge.classList.remove('show');
  }

    if(n > 0){ settingsBadge.textContent = txt; settingsBadge.classList.add('show'); }
    else settingsBadge.classList.remove('show');
  }
}

function getEntryTab(entry){

function updateMainTabCounts(){
  var counts = { generating: 0, unplayed: 0, played: 0 };
  state.history.forEach(function(h){
    var tab = getEntryTab(h);
    if(counts[tab] !== undefined) counts[tab]++;
  });
  $$('.main-tab').forEach(function(btn){
    var tab = btn.dataset.tab;
    var countEl = btn.querySelector('.tab-count');
    if(!countEl) return;
    if(tab === 'new'){
      countEl.style.display = 'none';
    } else {
      var c = counts[tab] || 0;
      countEl.textContent = c;
      countEl.style.display = c > 0 ? '' : 'none';
    }
  });
}

function switchMainTab(tab){
  if(TABS.indexOf(tab) === -1) return;
  state.mainTab = tab;
  save();
  $$('.main-tab').forEach(function(b){ b.classList.toggle('is-active', b.dataset.tab === tab); });
  $('#panelNew').hidden = tab !== 'new';
  $('#panelGenerating').hidden = tab !== 'generating';
  $('#panelUnplayed').hidden = tab !== 'unplayed';
  $('#panelPlayed').hidden = tab !== 'played';
  renderHistory();
  try{ window.scrollTo({ top: 0, behavior: 'smooth' }); }catch(e){ window.scrollTo(0, 0); }
}

/* ── Swipe tabs ── */
function initSwipeTabs(){
  var mainEl = document.querySelector('main');
  if(!mainEl) return;
  var startX = 0, startY = 0, tracking = false, startT = 0;

  mainEl.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1){ tracking = false; return; }
    var tgt = e.target;
    if(tgt && tgt.closest && tgt.closest('input,textarea,[data-no-swipe]')){ tracking = false; return; }
    tracking = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startT = Date.now();
  }, {passive:true});

  mainEl.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    if(Date.now() - startT > 800) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    if(Math.abs(dx) < 60) return;
    if(Math.abs(dy) > Math.abs(dx) * 0.8) return;
    var idx = TABS.indexOf(state.mainTab);
    var newIdx = dx < 0 ? Math.min(TABS.length - 1, idx + 1) : Math.max(0, idx - 1);
    if(newIdx !== idx){
      suppressClickUntil = Date.now() + 400;
      switchMainTab(TABS[newIdx]);
    }
  }, {passive:true});

  mainEl.addEventListener('touchcancel', function(){ tracking = false; }, {passive:true});
}

var SVG_IMPORT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
var SVG_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .8.87 1.29 1.56.9l10.9-6.86a1.05 1.05 0 0 0 0-1.8L9.56 4.24A1.05 1.05 0 0 0 8 5.14Z"/></svg>';

function makeHistoryRow(h){
  var isPlaying = (h.id === currentId) && !audio.paused && !audio.ended;
  var row = document.createElement('div');
  row.className = 'history-item' +
    (isPlaying ? ' playing' : '') +
    (h.read && !isPlaying ? ' read' : '');
  row.dataset.id = h.id;

  var thumb;
  if(h.hasAudio){
    thumb = isPlaying
      ? '<div class="eq"><i></i><i></i><i></i><i></i></div>'
      : SVG_PLAY;
  }else{
    thumb = SVG_IMPORT;
  }

  var durTxt = '';
  if(h.hasAudio && h.audioDuration > 0) durTxt = fmtTime(h.audioDuration);
  else if(h.hasAudio) durTxt = '音声あり';
  else durTxt = '音声未登録';
  var timePart = (h.date || '').split(' ').pop() || '';

  var pct = 0;
  if(h.id === currentId && h.audioDuration > 0){
    pct = Math.min(100, ((audio.currentTime || 0) / h.audioDuration) * 100);
  } else if(h.hasAudio && audioPositions[h.id] > 0 && h.audioDuration > 0){
    pct = Math.min(100, (audioPositions[h.id] / h.audioDuration) * 100);
  }

  row.innerHTML =
    '<button type="button" class="thumb" aria-label="' + (h.hasAudio ? '再生' : '音声を取り込む') + '">' + thumb + '</button>' +
    '<div class="history-text">' +
      '<div class="history-title">' + numPill(h.number) + esc(h.title) + '</div>' +
      '<div class="history-sub">' +
        '<span class="history-time">' + esc(timePart) + '<span class="history-gen">生成</span></span>' +
        '<span class="history-dur">' + esc(durTxt) + '</span>' +
      '</div>' +
    '</div>' +
    '<button type="button" class="history-del" aria-label="削除">✕</button>' +
    (pct > 0.5 ? '<div class="history-bar" style="width:' + pct.toFixed(1) + '%"></div>' : '');
  return row;
}

function initTagInteractions(){
  var pressTimer = null;
  var pendingBtn = null;
  var pendingKind = null;
  var startX = 0, startY = 0;

  function reset(){
    clearTimeout(pressTimer); pressTimer = null; pendingBtn = null; pendingKind = null;
  }

  document.addEventListener('pointerdown', function(e){
    var btn = e.target.closest ? e.target.closest('button.tag') : null;
    if(!btn) return;
    var kind = null;
    if(btn.closest('#promptTags')) kind = 'folder';
    else if(btn.closest('#tags')) kind = 'theme';
    if(!kind) return;

    startX = e.clientX; startY = e.clientY;
    pendingBtn = btn;
    pendingKind = kind;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function(){
      pressTimer = null;
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(err){} }
    }, LONG_PRESS_MS);
  }, { passive:true });

  document.addEventListener('pointermove', function(e){
    if(!pressTimer && !pendingBtn) return;
    if(Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) reset();
  }, { passive:true });

  document.addEventListener('pointerup', function(){
    var wasPressed = pressTimer === null && pendingBtn && pendingKind;
    clearTimeout(pressTimer); pressTimer = null;
    if(wasPressed){
      var id = pendingBtn.dataset.id;
      var kind = pendingKind;
      pendingBtn = null; pendingKind = null;
      suppressClickUntil = Date.now() + 800;
      openEditFromMain(kind, id);
    } else {
      pendingBtn = null; pendingKind = null;
    }
  });

  document.addEventListener('pointercancel', reset);

  document.addEventListener('click', function(e){
    if(Date.now() < suppressClickUntil){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    }
  }, true);

  document.addEventListener('contextmenu', function(e){
    if(e.target && e.target.closest && e.target.closest('button.tag')) e.preventDefault();
  });
}

/* ── Copy / External ── */
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  return ok;
}
function copyQuiet(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  }
  fallbackCopy(text);
  return Promise.resolve();
}
function openExternal(url){
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if(isIOS && standalone){
    var navigated = false;
    var onVis = function(){ if(document.visibilityState === 'hidden') navigated = true; };
    document.addEventListener('visibilitychange', onVis);
    try{ window.location.href = 'x-safari-' + url; }catch(e){}
    setTimeout(function(){
      document.removeEventListener('visibilitychange', onVis);
      if(navigated || document.visibilityState === 'hidden') return;
      window.open(url, '_blank');
    }, 1000);
    return;
  }

  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    if(a.parentNode) a.parentNode.removeChild(a);
  }, 2000);
}

/* ── Generate ── */
function buildPromptText(folder, theme){
  var parts = [];
  var common = (state.commonPrompt || '').trim();
  if(common) parts.push(common);
  var indiv = (folder.text || '').trim();
  if(indiv) parts.push(indiv);
  var combined = parts.join('\n\n');
  return combined.replace(/\{theme\}/g, theme.name || '');
}

async function handleGenerate(){
  if(generatingLock) return;
  var folder = getSelectedFolder();
  var theme = getSelectedTheme();
  if(!folder){ showToast('先にプロンプトを選択してください'); return; }
  if(!theme){ showToast('先にテーマを選択してください'); return; }

  generatingLock = true;
  var shareBtn = $('#shareBtn');
  if(shareBtn) shareBtn.disabled = true;

  try{
    var now = new Date();
    var nowMs = now.getTime();

    var reuseEntry = null;
    if(state.lastGenId && state.lastGenAt && (nowMs - state.lastGenAt) < REUSE_WINDOW_MS){
      var candidate = getEntry(state.lastGenId);
      if(candidate && !candidate.hasAudio && candidate.folderName === folder.name && candidate.themeName === theme.name){
        reuseEntry = candidate;
      }
    }

    var num;
    if(reuseEntry){
      num = reuseEntry.number;
    } else {
      num = state.nextNumber;
    }

    var instruction = 'タイトルの頭に【' + formatNum(num) + '】を付けてください。';
    var promptText = buildPromptText(folder, theme);
    promptText = (promptText.trim() ? promptText + '\n\n' : '') + instruction;

    var sourceText = ((theme.source || '').trim() || (theme.name || '').trim());
    sourceText = sourceText ? (sourceText + '\n\n' + instruction) : instruction;

    var title = (theme.name || '(無題)') + ' / ' + (folder.name || 'プロンプト');
    var dateLabel = formatDateLabel(now);

    if(reuseEntry){
      reuseEntry.date = dateLabel;
      reuseEntry.time = nowMs;
      reuseEntry.read = false;
      reuseEntry.title = title;
    } else {
      var entry = {
        id: uid(),
        number: num,
        title: title,
        date: dateLabel,
        time: nowMs,
        read: false,
        hasAudio: false,
        audioDuration: 0,
        folderName: folder.name,
        themeName: theme.name
      };
      state.history.unshift(entry);
      state.lastGenId = entry.id;
      state.nextNumber = num + 1;
      if(state.history.length > MAX_HISTORY) trimHistory();
    }

    state.lastGenAt = nowMs;
    save();
    renderAll();

    copyQuiet(promptText);

    if(navigator.share){
      try{
        await navigator.share({ text: sourceText });
      }catch(err){
        if(!err || err.name !== 'AbortError'){
          copyQuiet(sourceText);
        }
      }
    } else {
      copyQuiet(sourceText);
    }

    showToast(
      formatNum(num) + (reuseEntry ? ' を更新しました' : ' を生成中に追加しました'),
      '生成中を見る',
      function(){ switchMainTab('generating'); },
      6000
    );
  } finally {
    generatingLock = false;
    if(shareBtn) shareBtn.disabled = false;
  }
}

/* ── Audio import ── */
function isAudioFile(file){
  if(!file) return false;
  if(/^audio\//.test(file.type)) return true;
  return /\.(m4a|m4b|mp3|aac|wav|ogg|oga|flac|opus|mp4|aiff?)$/i.test(file.name);
}
function probeAudio(file){
  return new Promise(function(resolve){
    var a = document.createElement('audio');
    a.preload = 'metadata';
    var done = false;
    var finish = function(d){
      if(done) return;
      done = true;
      try{ a.removeAttribute('src'); }catch(e){}
      resolve(d);
    };
    a.onloadedmetadata = function(){
      finish(isFinite(a.duration) && a.duration > 0 ? a.duration : 0);
    };
    a.onerror = function(){ finish(0); };
    a.src = URL.createObjectURL(file);
  });
}

async function importAudioTo(entry, file, isNew){
  if(!entry || !file) return;
  if(!isAudioFile(file)){ return; }

  var dur = await probeAudio(file);

  try{
    if(db) await dbPutAudio(entry.id, file, file.name);
  }catch(e){
    console.warn(e);
    showToast('音声の保存に失敗しました');
    return;
  }

  if(audioUrls[entry.id]){
    try{ URL.revokeObjectURL(audioUrls[entry.id]); }catch(e){}
  }
  audioUrls[entry.id] = URL.createObjectURL(file);

  entry.hasAudio = true;
  entry.audioDuration = dur;
  entry.audioName = file.name;
  if(isNew){
    entry.title = cleanTitleFromFile(file.name);
  }

  audioPositions[entry.id] = 0;
  if(db) dbSavePos(entry.id, 0).catch(function(){});

  save();
  state.mainTab = 'unplayed';
  renderAll();
  switchMainTab('unplayed');
}

function pickFileFor(entryId){
  var entry = getEntry(entryId);
  if(!entry) return;
  var input = document.getElementById('fileInput');
  input.value = '';
  input.onchange = function(){
    var f = input.files && input.files[0];
    input.value = '';
    if(!f) return;
    importAudioTo(entry, f, false).then(function(){
      showToast(formatNum(entry.number) + ' に音声を取り込みました');
      setTimeout(function(){ playEntry(entry.id); }, 300);
    });
  };
  input.click();
}

/* ── Audio matching ── */
function createEntryFromAudio(file){
  var num = state.nextNumber;
  var entry = {
    id: uid(),
    number: num,
    title: cleanTitleFromFile(file.name),
    date: formatDateLabel(new Date()),
    time: Date.now(),
    read: false,
    hasAudio: false,
    audioDuration: 0,
    fromAudio: true
  };
  state.history.unshift(entry);
  state.nextNumber = num + 1;
  return entry;
}

function getMatchCandidates(file){
  var baseName = cleanTitleFromFile(file.name);
  return state.history
    .filter(function(h){ return !h.hasAudio; })
    .map(function(h){ return { entry: h, score: scoreEntryMatch(baseName, h) }; })
    .filter(function(c){ return c.score >= MIN_CANDIDATE_SCORE; })
    .sort(function(a, b){ return b.score - a.score; });
}

function decideTargetForFile(file){
  var candidates = getMatchCandidates(file);

  if(!candidates.length){
    return Promise.resolve({ action: 'new' });
  }

  var best = candidates[0];
  var second = candidates[1] || null;
  var clear = best.score >= AUTO_MATCH_THRESHOLD &&
              (!second || (best.score - second.score) >= AUTO_MATCH_MARGIN);

  if(clear){
    return Promise.resolve({ action: 'match', entry: best.entry });
  }

  return new Promise(function(resolve){
    openMatchPicker(file, candidates, resolve);
  });
}

function openMatchPicker(file, candidates, resolve){
  var modal = $('#matchModal');
  if(!modal){
    resolve({ action: 'new' });
    return;
  }
  pendingMatchResolve = resolve;

  $('#matchFileName').textContent = file.name;

  var listEl = $('#matchCandidates');
  listEl.innerHTML = '';
  if(!candidates.length){
    listEl.innerHTML = '<div class="match-empty">該当する生成中データが見つかりません</div>';
  } else {
    candidates.forEach(function(c){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'match-cand';
      btn.innerHTML =
        '<div class="match-cand-text">' +
          '<div class="match-cand-title">' + numPill(c.entry.number) + esc(c.entry.title || '(無題)') + '</div>' +
          '<div class="match-cand-sub">' + esc(c.entry.date || '') + '</div>' +
        '</div>' +
        '<span class="match-cand-score">' + Math.round(c.score * 100) + '%</span>';
      btn.addEventListener('click', function(){
        finishMatch({ action: 'match', entry: c.entry });
      });
      listEl.appendChild(btn);
    });
  }

  $('#matchNewBtn').onclick = function(){ finishMatch({ action: 'new' }); };
  $('#matchSkipBtn').onclick = function(){ finishMatch({ action: 'skip' }); };
  $('#matchModalClose').onclick = function(){ finishMatch({ action: 'skip' }); };

  modal.classList.add('show');
  document.body.classList.add('modal-open');
}

function finishMatch(result){
  var resolve = pendingMatchResolve;
  pendingMatchResolve = null;
  var modal = $('#matchModal');
  if(modal) modal.classList.remove('show');
  updateModalOpenState();
  if(resolve) resolve(result);
}

/* ── Multiple audio drop ── */
async function handleAudioDrops(files){
  var list = Array.from(files || []).filter(isAudioFile);
  if(!list.length){ showToast('音声ファイルが見つかりません'); return; }

  var added = 0, matched = 0, skipped = 0;
  var firstImportedId = null;

  for(var i=0; i<list.length; i++){
    var file = list[i];
    var result = await decideTargetForFile(file);

    if(result.action === 'skip'){ skipped++; continue; }

    var target;
    var isNew = false;
    if(result.action === 'new'){
      target = createEntryFromAudio(file);
      isNew = true;
      added++;
    } else {
      target = result.entry;
      matched++;
    }

    await importAudioTo(target, file, isNew);
    if(!firstImportedId) firstImportedId = target.id;
  }

  save();

  if(!firstImportedId && skipped){
    showToast(skipped + ' 件をスキップしました');
    return;
  }

  var parts = [];
  if(matched) parts.push(matched + ' 件紐づけ');
  if(added) parts.push(added + ' 件追加');
  if(skipped) parts.push(skipped + ' 件スキップ');
  if(parts.length) showToast(parts.join(' / '));

  if(firstImportedId){
    setTimeout(function(){ playEntry(firstImportedId); }, 400);
  }
}

var audio = document.getElementById('audio');
var playerEl, seekEl, pTitle, pSub, pCurrent, pTotal, playBtn, headBtn, back15Btn, fwd15Btn,
    repBtn, repNum, speedSlider, speedValue, resetSpeedBtn;

function cachePlayerEls(){
  playerEl = $('#player');

  repNum = $('#repNum');

  speedValue = $('#speedValue');

}

async function ensureAudioUrl(id){
  if(audioUrls[id]) return audioUrls[id];
  if(!db) return null;
  var rec = await dbGetAudio(id);
  if(!rec || !rec.blob) return null;
  audioUrls[id] = URL.createObjectURL(rec.blob);
  return audioUrls[id];
}

async function playEntry(id){
  var entry = getEntry(id);
  if(!entry) return;
  if(!entry.hasAudio){ pickFileFor(id); return; }

  if(currentId === id && audio.src){
    if(audio.paused || audio.ended) audio.play().catch(function(){});
    else audio.pause();
    return;
  }

  var url = await ensureAudioUrl(id);
  if(!url){ showToast('音声が見つかりません'); return; }

  currentId = id;
  audio.src = url;
  audio.playbackRate = state.rate;
  if('preservesPitch' in audio) audio.preservesPitch = true;

  updateMediaSession(entry);
  if(playerEl) playerEl.classList.add('show');
  renderHistory();
  updatePlayer();

  var pos = audioPositions[id] || 0;
  var applyPos = function(){
    if(pos > 0.5 && audio.duration && pos < audio.duration - 1){
      audio.currentTime = pos;
    }
    setSeekUI();
    updatePositionState();
  };
  if(audio.readyState >= 1) applyPos();
  else audio.addEventListener('loadedmetadata', applyPos, { once: true });

  audio.play().catch(function(){});
}

function togglePlay(){
  if(!currentId){
    for(var i=0;i<state.history.length;i++){
      if(state.history[i].hasAudio){ playEntry(state.history[i].id); return; }
    }
    showToast('音声が取り込まれたCastがありません');
    return;
  }
  if(audio.paused || audio.ended) audio.play().catch(function(){});
  else audio.pause();
}

function skip(sec){
  if(!audio.src) return;
  var dur = isFinite(audio.duration) ? audio.duration : 0;
  var target = audio.currentTime + sec;
  audio.currentTime = Math.max(0, dur ? Math.min(dur, target) : target);
  setSeekUI();
  updatePositionState();
}

function seekToStart(){
  if(!audio.src) return;
  audio.currentTime = 0;
  setSeekUI();
  updatePositionState();
}

function onEnded(){
  var entry = getEntry(currentId);
  if(!entry){ renderHistory(); return; }

  if(state.repeatMode === 'one'){
    audio.currentTime = 0;
    audio.play().catch(function(){});
    return;
  }

  if(!entry.read){
    entry.read = true;
    save();
  }

  var withAudio = state.history.filter(function(h){ return h.hasAudio; });
  var idx = withAudio.findIndex(function(h){ return h.id === currentId; });
  var next = null;
  if(state.repeatMode === 'all' && withAudio.length > 1){
    next = withAudio[(idx + 1) % withAudio.length];
  }

  if(next && next.id !== currentId){
    playEntry(next.id);
  }else{
    document.body.classList.remove('is-playing');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    renderHistory();
  }
}

function setSeekUI(){
  if(!seekEl) return;
  var entry = getEntry(currentId);
  var dur = (isFinite(audio.duration) && audio.duration > 0)
    ? audio.duration
    : (entry && entry.audioDuration ? entry.audioDuration : 0);
  var pos = Math.min(audio.currentTime || 0, dur || 0);
  var p = dur > 0 ? (pos / dur) * 100 : 0;
  seekEl.value = Math.round(p * 10);
  seekEl.style.setProperty('--p', p.toFixed(2) + '%');
  if(pCurrent) pCurrent.textContent = fmtTime(pos);
  if(pTotal) pTotal.textContent = fmtTime(dur);
}

function updatePlayer(){
  if(!playerEl) return;
  var entry = getEntry(currentId);
  if(!entry){ playerEl.classList.remove('show'); return; }
  playerEl.classList.add('show');
  if(pTitle) pTitle.innerHTML = numPill(entry.number) + esc(entry.title);
  if(pSub) pSub.textContent = entry.date || '';
  if(!scrubbing) setSeekUI();
}

function setRate(r, syncSlider){
  state.rate = Math.round(r * 10) / 10;
  audio.playbackRate = state.rate;
  if('preservesPitch' in audio) audio.preservesPitch = true;
  if(syncSlider !== false && speedSlider) speedSlider.value = state.rate;
  if(speedSlider){
    var p = ((state.rate - 0.5) / 2.5) * 100;
    speedSlider.style.setProperty('--p', p + '%');
  }
  if(speedValue) speedValue.textContent = fmtRate(state.rate);
  save();
  updatePositionState();
}

function setRepeat(mode){
  state.repeatMode = mode;
  if(repBtn){
    repBtn.classList.toggle('on', mode !== 'off');
    repBtn.classList.toggle('one', mode === 'one');
    repBtn.setAttribute('aria-label',
      mode === 'off' ? 'リピート切替（オフ）' :
      mode === 'all' ? 'リピート切替（全曲）' : 'リピート切替（1曲）');
  }
  save();
}

/* ── Media Session ── */
function updateMediaSession(entry){
  if(!('mediaSession' in navigator)) return;
  if(!entry){
    try{ navigator.mediaSession.metadata = null; }catch(e){}
    return;
  }
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: numTag(entry.number) + entry.title,
      artist: 'MyCast',
      album: '音声解説',
      artwork: [{ src: ICON_ABS, sizes: '512x512', type: 'image/png' }]
    });
  }catch(e){}
}
function updatePositionState(){
  if(!('mediaSession' in navigator)) return;
  var ms = navigator.mediaSession;
  if(typeof ms.setPositionState !== 'function') return;
  var d = audio.duration;
  if(!isFinite(d) || d <= 0) return;
  try{
    ms.setPositionState({
      duration: d,
      playbackRate: audio.playbackRate || 1,
      position: Math.min(Math.max(audio.currentTime, 0), d)
    });
  }catch(e){}
}
function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  var ms = navigator.mediaSession;
  var safe = function(a, fn){ try{ ms.setActionHandler(a, fn); }catch(e){} };
  safe('play', function(){ audio.play().catch(function(){}); });
  safe('pause', function(){ audio.pause(); });
  safe('stop', function(){ audio.pause(); audio.currentTime = 0; });
  safe('seekbackward', function(){ skip(-15); });
  safe('seekforward', function(){ skip(15); });
  safe('seekto', function(d){
    if(d && typeof d.seekTime === 'number'){
      audio.currentTime = d.seekTime;
      updatePositionState();
    }
  });
}

/* ── Delete ── */
function deleteHistory(id){
  var entry = getEntry(id);
  if(!entry) return;
  if(!confirm('このCastを削除しますか？（音声も削除されます）')) return;

  if(currentId === id){
    audio.pause();
    audio.removeAttribute('src');
    try{ audio.load(); }catch(e){}
    currentId = null;
    if(playerEl) playerEl.classList.remove('show');
    updateMediaSession(null);
  }
  if(audioUrls[id]){
    try{ URL.revokeObjectURL(audioUrls[id]); }catch(e){}
    delete audioUrls[id];
  }
  delete audioPositions[id];
  if(db){ dbDelAudio(id).catch(function(){}); dbDelPos(id).catch(function(){}); }

  state.history = state.history.filter(function(h){ return h.id !== id; });
  if(state.lastGenId === id) state.lastGenId = null;
  save();
  renderHistory();
  showToast('削除しました');
}

function clearPlayed(){
  var played = state.history.filter(function(h){ return h.hasAudio && h.read; });
  if(!played.length){ showToast('再生済みの項目がありません'); return; }
  if(!confirm('再生済みの ' + played.length + ' 件をすべて削除しますか？\nこの操作は取り消せません。')) return;

  played.forEach(function(h){
    if(currentId === h.id){
      audio.pause();
      audio.removeAttribute('src');
      try{ audio.load(); }catch(e){}
      currentId = null;
      if(playerEl) playerEl.classList.remove('show');
      updateMediaSession(null);
    }
    if(audioUrls[h.id]){
      try{ URL.revokeObjectURL(audioUrls[h.id]); }catch(e){}
      delete audioUrls[h.id];
    }
    delete audioPositions[h.id];
    if(db){ dbDelAudio(h.id).catch(function(){}); dbDelPos(h.id).catch(function(){}); }
  });
  state.history = state.history.filter(function(h){ return !(h.hasAudio && h.read); });
  save();
  renderHistory();
  showToast(played.length + ' 件を削除しました');
}
