/* ── Settings drag + auto-scroll ── */
function startAutoScrollLoop(){
  if(settingsAutoScrollRAF) return;
  var step = function(){
    if(!settingsDrag || !settingsDrag.active){
      settingsAutoScrollRAF = null;
      return;
    }
    if(settingsDrag.autoScrollDir){
      var scroller = $('.tab-scroll');
      if(scroller) scroller.scrollTop += settingsDrag.autoScrollDir * 10;
    }
    settingsAutoScrollRAF = requestAnimationFrame(step);
  };
  settingsAutoScrollRAF = requestAnimationFrame(step);
}

function initSettingsDrag(){
  document.addEventListener('pointerdown', function(e){
    var grip = e.target.closest ? e.target.closest('[data-drag-folder], [data-drag-theme]') : null;
    if(!grip) return;
    var isFolder = grip.hasAttribute('data-drag-folder');
    var container = isFolder ? grip.closest('[data-folder-id]') : grip.closest('[data-theme-id]');
    if(!container) return;

    var folderEl = isFolder ? container : container.closest('[data-folder-id]');
    if(!folderEl) return;

    e.preventDefault();
    settingsDrag = {
      kind: isFolder ? 'folder' : 'theme',
      folderId: folderEl.dataset.folderId,
      themeId: isFolder ? null : container.dataset.themeId,
      startX: e.clientX,
      startY: e.clientY,
      active: false,
      ghost: null,
      originalEl: container,
      dropTarget: null,
      autoScrollDir: 0,
      name: isFolder
        ? (folderEl.querySelector('.folder-name-label') || {}).textContent
        : (container.querySelector('.theme-name-label') || {}).textContent
    };
  });

  document.addEventListener('pointermove', function(e){
    if(!settingsDrag) return;
    if(!settingsDrag.active){
      var dist = Math.hypot(e.clientX - settingsDrag.startX, e.clientY - settingsDrag.startY);
      if(dist < 6) return;
      settingsDrag.active = true;
      var ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.textContent = '⠿ ' + (settingsDrag.name || '(無題)');
      document.body.appendChild(ghost);
      settingsDrag.ghost = ghost;
      settingsDrag.originalEl.style.opacity = '0.35';
      if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(e){} }
      startAutoScrollLoop();
    }
    settingsDrag.ghost.style.left = (e.clientX + 12) + 'px';
    settingsDrag.ghost.style.top = (e.clientY + 12) + 'px';
    updateSettingsDropTarget(e.clientX, e.clientY);

    var scroller = $('.tab-scroll');
    if(scroller){
      var rect = scroller.getBoundingClientRect();
      var edge = 70;
      if(e.clientY < rect.top + edge) settingsDrag.autoScrollDir = -1;
      else if(e.clientY > rect.bottom - edge) settingsDrag.autoScrollDir = 1;
      else settingsDrag.autoScrollDir = 0;
    }
  });

  document.addEventListener('pointerup', function(e){
    if(!settingsDrag) return;
    if(settingsDrag.active){
      performSettingsDrop();
    }
    cleanupSettingsDrag();
  });

  document.addEventListener('pointercancel', cleanupSettingsDrag);
}

function updateSettingsDropTarget(x, y){
  $$('.drop-before, .drop-after, .drop-over').forEach(function(el){
    el.classList.remove('drop-before', 'drop-after', 'drop-over');
  });
  settingsDrag.dropTarget = null;

  var el = document.elementFromPoint(x, y);
  if(!el) return;
  if(settingsDrag.ghost && settingsDrag.ghost.contains(el)) return;

  if(settingsDrag.kind === 'folder'){
    var targetFolder = el.closest('.settings-folder');
    if(!targetFolder) return;
    if(targetFolder.dataset.folderId === settingsDrag.folderId) return;
    var rect = targetFolder.getBoundingClientRect();
    if(y < rect.top + rect.height / 2){
      targetFolder.classList.add('drop-before');
    } else {
      targetFolder.classList.add('drop-after');
    }
    settingsDrag.dropTarget = { type: 'folder', el: targetFolder };
    return;
  }

  var targetTheme = el.closest('[data-theme-id]');
  if(targetTheme && targetTheme.dataset.themeId !== settingsDrag.themeId){
    var r2 = targetTheme.getBoundingClientRect();
    if(y < r2.top + r2.height / 2){
      targetTheme.classList.add('drop-before');
    } else {
      targetTheme.classList.add('drop-after');
    }
    settingsDrag.dropTarget = { type: 'theme', el: targetTheme };
    return;
  }

  var targetFolder2 = el.closest('.settings-folder');
  if(targetFolder2){
    targetFolder2.classList.add('drop-over');
    settingsDrag.dropTarget = { type: 'folder-as-theme', el: targetFolder2 };
  }
}

function performSettingsDrop(){
  var dt = settingsDrag && settingsDrag.dropTarget;
  if(!dt) return;

  if(settingsDrag.kind === 'folder'){
    var srcIdx = state.prompts.findIndex(function(p){ return p.id === settingsDrag.folderId; });
    if(srcIdx === -1) return;
    var targetFolderId = dt.el.dataset.folderId;
    var targetIdx = state.prompts.findIndex(function(p){ return p.id === targetFolderId; });
    if(targetIdx === -1) return;

    var insertBefore = dt.el.classList.contains('drop-before');
    var folder = state.prompts.splice(srcIdx, 1)[0];

    var finalIdx;
    if(insertBefore){
      finalIdx = (srcIdx < targetIdx) ? targetIdx - 1 : targetIdx;
    } else {
      finalIdx = (srcIdx < targetIdx) ? targetIdx : targetIdx + 1;
    }
    finalIdx = Math.max(0, Math.min(state.prompts.length, finalIdx));
    state.prompts.splice(finalIdx, 0, folder);
    save();
    renderFoldersEditor();
    renderPromptTags();
    updateDataTabBadge();
    return;
  }

  var srcFolder = state.prompts.find(function(p){ return p.id === settingsDrag.folderId; });
  if(!srcFolder) return;
  var srcThemeIdx = srcFolder.themes.findIndex(function(t){ return t.id === settingsDrag.themeId; });
  if(srcThemeIdx === -1) return;
  var theme = srcFolder.themes[srcThemeIdx];

  if(dt.type === 'theme'){
    var targetThemeId = dt.el.dataset.themeId;
    var targetFolderId2 = dt.el.closest('[data-folder-id]').dataset.folderId;
    var targetFolder = state.prompts.find(function(p){ return p.id === targetFolderId2; });
    if(!targetFolder) return;
    var targetThemeIdx = targetFolder.themes.findIndex(function(t){ return t.id === targetThemeId; });
    if(targetThemeIdx === -1) return;

    var insertBefore2 = dt.el.classList.contains('drop-before');

    srcFolder.themes.splice(srcThemeIdx, 1);

    var finalIdx2;
    if(srcFolder === targetFolder){
      if(insertBefore2){
        finalIdx2 = (srcThemeIdx < targetThemeIdx) ? targetThemeIdx - 1 : targetThemeIdx;
      } else {
        finalIdx2 = (srcThemeIdx < targetThemeIdx) ? targetThemeIdx : targetThemeIdx + 1;
      }
      finalIdx2 = Math.max(0, Math.min(targetFolder.themes.length, finalIdx2));
      targetFolder.themes.splice(finalIdx2, 0, theme);
    } else {
      finalIdx2 = insertBefore2 ? targetThemeIdx : targetThemeIdx + 1;
      finalIdx2 = Math.max(0, Math.min(targetFolder.themes.length, finalIdx2));
      targetFolder.themes.splice(finalIdx2, 0, theme);
      if(state.selectedThemeId === theme.id){
        state.selectedPromptId = targetFolder.id;
      }
    }
  } else if(dt.type === 'folder-as-theme'){
    var targetFolderId3 = dt.el.dataset.folderId;
    var targetFolder3 = state.prompts.find(function(p){ return p.id === targetFolderId3; });
    if(!targetFolder3) return;
    if(targetFolder3 === srcFolder) return;
    srcFolder.themes.splice(srcThemeIdx, 1);
    targetFolder3.themes.push(theme);
    if(state.selectedThemeId === theme.id){
      state.selectedPromptId = targetFolder3.id;
    }
  }

  save();
  renderFoldersEditor();
  renderPromptTags();
  renderThemeTags();
  renderShareBtn();
  updateDataTabBadge();
}

function cleanupSettingsDrag(){
  if(settingsDrag){
    if(settingsDrag.ghost && settingsDrag.ghost.parentNode) settingsDrag.ghost.parentNode.removeChild(settingsDrag.ghost);
    if(settingsDrag.originalEl) settingsDrag.originalEl.style.opacity = '';
  }
  if(settingsAutoScrollRAF){
    cancelAnimationFrame(settingsAutoScrollRAF);
    settingsAutoScrollRAF = null;
  }
  $$('.drop-before, .drop-after, .drop-over').forEach(function(el){
    el.classList.remove('drop-before', 'drop-after', 'drop-over');
  });
  settingsDrag = null;
}

/* ── Export / Import ── */
function exportData(){
  // 履歴は含めない。プロンプト・テーマのみバックアップ対象。
  var data = {
    app: 'MyCast',
    version: 4,
    exportedAt: new Date().toISOString(),
    commonPrompt: state.commonPrompt,
    prompts: state.prompts,
    selectedPromptId: state.selectedPromptId,
    selectedThemeId: state.selectedThemeId,
    nextNumber: state.nextNumber,
    rate: state.rate,
    repeatMode: state.repeatMode,
    mainTab: state.mainTab
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var name = 'mycast-backup.json';

  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    if(a.parentNode) a.parentNode.removeChild(a);
    URL.revokeObjectURL(url);
  }, 5000);

  state.lastExportSnapshot = computeDataSnapshot();
  save();
  updateDataTabBadge();

  showToast('エクスポートしました');
}

function importData(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(String(reader.result)); }
    catch(e){ showToast('読み込めないファイルです'); return; }
    if(!data || typeof data !== 'object' || !Array.isArray(data.prompts)){
      showToast('読み込めないファイルです'); return;
    }
    if(!confirm('現在のプロンプト・テーマを置き換えます。よろしいですか？\n（履歴と音声は保持されます）')) return;

    state.commonPrompt = (typeof data.commonPrompt === 'string') ? data.commonPrompt : '';
    state.prompts = data.prompts;

    // 履歴はファイルに含まれないため、既存履歴を保持する。
    // ファイルに history がある場合のみ取り込む（後方互換）。
    if(Array.isArray(data.history)){
      Object.keys(audioUrls).forEach(function(k){
        try{ URL.revokeObjectURL(audioUrls[k]); }catch(e){}
      });
      audioUrls = {};
      audioPositions = {};
      state.history = data.history.map(function(h){
        return {
          id: safeId(h.id) ? h.id : uid(),
          number: (typeof h.number === 'number') ? h.number : 0,
          title: typeof h.title === 'string' ? h.title : '',
          date: typeof h.date === 'string' ? h.date : '',
          time: typeof h.time === 'number' ? h.time : 0,
          read: !!h.read,
          hasAudio: false,
          audioDuration: (typeof h.audioDuration === 'number') ? h.audioDuration : 0,
          folderName: typeof h.folderName === 'string' ? h.folderName : '',
          themeName: typeof h.themeName === 'string' ? h.themeName : ''
        };
      });
    }

    state.selectedPromptId = data.selectedPromptId || null;
    state.selectedThemeId = data.selectedThemeId || null;
    if(typeof data.nextNumber === 'number') state.nextNumber = data.nextNumber;
    if(typeof data.rate === 'number') state.rate = data.rate;
    if(typeof data.repeatMode === 'string') state.repeatMode = data.repeatMode;
    if(typeof data.mainTab === 'string') state.mainTab = data.mainTab;

    migrateSchema();
    normalize();
    state.lastExportSnapshot = computeDataSnapshot();
    save();
    renderAll();
    renderFoldersEditor();
    renderCommonPrompt();
    setRate(state.rate);
    setRepeat(state.repeatMode);
    switchMainTab(state.mainTab);
    updateDataTabBadge();
    showToast('インポートしました');
  };
  reader.onerror = function(){ showToast('読み込めませんでした'); };
  reader.readAsText(file);
}

    seekEl.addEventListener('input', function(){
      scrubbing = true;
      var p = Number(seekEl.value) / 1000;
      seekEl.style.setProperty('--p', (p * 100).toFixed(2) + '%');
      var entry = getEntry(currentId);
      var dur = isFinite(audio.duration) && audio.duration > 0
        ? audio.duration : (entry && entry.audioDuration) || 0;
      if(pCurrent) pCurrent.textContent = fmtTime(p * dur);
      if(pTotal) pTotal.textContent = fmtTime(dur);
    });
    seekEl.addEventListener('change', function(){
      var p = Number(seekEl.value) / 1000;
      var dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
      if(dur) audio.currentTime = p * dur;
      scrubbing = false;
      setSeekUI();
      if(currentId){
        audioPositions[currentId] = audio.currentTime || 0;
        if(db) dbSavePos(currentId, audioPositions[currentId]).catch(function(){});
      }
      updatePositionState();
    });
  }

  // ─── Audio events ───
  audio.addEventListener('play', function(){
    document.body.classList.add('is-playing');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    renderHistory();
    updatePlayer();
  });
  audio.addEventListener('pause', function(){
    document.body.classList.remove('is-playing');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    renderHistory();
    updatePlayer();
    if(currentId){
      audioPositions[currentId] = audio.currentTime || 0;
      if(db) dbSavePos(currentId, audioPositions[currentId]).catch(function(){});
    }
  });
  audio.addEventListener('loadedmetadata', function(){
    if(currentId){
      var entry = getEntry(currentId);
      if(entry && isFinite(audio.duration) && audio.duration > 0 &&
         Math.abs((entry.audioDuration || 0) - audio.duration) > 0.5){
        entry.audioDuration = audio.duration;
        save();
        renderHistory();
      }
    }
    setSeekUI();
    updatePositionState();
  });
  audio.addEventListener('timeupdate', function(){
    if(currentId) audioPositions[currentId] = audio.currentTime;
    if(!scrubbing) setSeekUI();
    updatePositionState();
  });
  audio.addEventListener('ended', onEnded);
  audio.addEventListener('error', function(){ showToast('この音声を再生できませんでした'); });

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      if(currentId){
        var entry = getEntry(currentId);
        if(entry) updateMediaSession(entry);
      }
      if('mediaSession' in navigator){
        try{
          navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
        }catch(e){}
      }
    }
  });

  window.addEventListener('pagehide', function(){
    if(currentId){
      audioPositions[currentId] = audio.currentTime || 0;
      if(db) dbSavePos(currentId, audioPositions[currentId]).catch(function(){});
    }
  });

  setupMediaSession();

  // ─── ドラッグ&ドロップ（複数音声） ───
  var dragDepth = 0;
  var overlay = $('#dropOverlay');
  window.addEventListener('dragenter', function(e){
    if(!e.dataTransfer || Array.from(e.dataTransfer.types || []).indexOf('Files') === -1) return;
    e.preventDefault();
    dragDepth++;
    if(overlay) overlay.classList.add('show');
  });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('dragleave', function(e){
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if(dragDepth === 0 && overlay) overlay.classList.remove('show');
  });
  window.addEventListener('drop', function(e){
    e.preventDefault();
    dragDepth = 0;
    if(overlay) overlay.classList.remove('show');
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      handleAudioDrops(e.dataTransfer.files);
    }
  });
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){ e.preventDefault(); });

  // ダブルタップズーム抑止
  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if(now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive:false });
});

})();
</script>
</body>
</html>
